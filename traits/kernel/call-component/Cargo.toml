[package]
name = "kernel-call-component"
version = "0.1.0"
edition = "2021"
description = "kernel.call as a WebAssembly Component Model component"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.39", features = ["bitflags"] }
serde_json = "1"

[package.metadata.component]
package = "traits:kernel-call"

[package.metadata.component.target]
path = "wit"
world = "call-world"

[package.metadata.component.target.dependencies]
"traits:kernel-host" = { path = "wit/deps/kernel-host" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
