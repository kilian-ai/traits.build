[trait]
description = "Portable CLI command processor — shared between WASM and native targets"
version = "v260415.150830"
checksum = "058134f0482d4ee2d8f05d9ce8ff07231be4e28a40429a8c863d9d3d1b13d38e"
author = "system"
tags = ["kernel", "cli"]
provides = ["kernel/cli"]

[requires]
native = "cli/backend"
wasm = "cli/backend"

[bindings]
native = "sys.cli.native"
wasm = "sys.cli.wasm"

[signature]
params = [
    { name = "line", type = "string", description = "Command line to execute", required = true },
]

[signature.returns]
type = "string"
description = "ANSI-formatted output text"

[implementation]
language = "rust"
source = "builtin"
entry = "cli_dispatch"
wasm = true
wasm_callable = false