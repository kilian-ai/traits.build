[trait]
description = "Portable CLI command processor — shared between WASM and native targets"
version = "v260417.040815"
checksum = "708316b88087e119cf6468eb4d2a3ea07397bb1fe30eaffdaa3b1ba8722b74f8"
author = "system"
tags = ["kernel", "cli"]
provides = ["kernel/cli"]

[requires]
native = "cli/backend"
wasm = "cli/backend"

[bindings]
native = "sys.cli.native"
wasm = "sys.cli.wasm"

[signature]
params = [
    { name = "line", type = "string", description = "Command line to execute", required = true },
]

[signature.returns]
type = "string"
description = "ANSI-formatted output text"

[implementation]
language = "rust"
source = "builtin"
entry = "cli_dispatch"
wasm = true
wasm_callable = false