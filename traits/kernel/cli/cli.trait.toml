[trait]
description = "Portable CLI command processor — shared between WASM and native targets"
version = "v260418.225136"
checksum = "a9e0a2d730f14fc51fed65f4e41aa45c4931b7770c9ad8765416ae366d8f1c42"
author = "system"
tags = ["kernel", "cli"]
provides = ["kernel/cli"]

[requires]
native = "cli/backend"
wasm = "cli/backend"

[bindings]
native = "sys.cli.native"
wasm = "sys.cli.wasm"

[signature]
params = [
    { name = "line", type = "string", description = "Command line to execute", required = true },
]

[signature.returns]
type = "string"
description = "ANSI-formatted output text"

[implementation]
language = "rust"
source = "builtin"
entry = "cli_dispatch"
wasm = true
wasm_callable = false