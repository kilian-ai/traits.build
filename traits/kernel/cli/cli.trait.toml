[trait]
description = "Portable CLI command processor — shared between WASM and native targets"
version = "v260417.154721"
checksum = "2f65a9c1af4f080e4d7b6708be8d90790eaca7564d1d37c1b5447d4c5d4229b3"
author = "system"
tags = ["kernel", "cli"]
provides = ["kernel/cli"]

[requires]
native = "cli/backend"
wasm = "cli/backend"

[bindings]
native = "sys.cli.native"
wasm = "sys.cli.wasm"

[signature]
params = [
    { name = "line", type = "string", description = "Command line to execute", required = true },
]

[signature.returns]
type = "string"
description = "ANSI-formatted output text"

[implementation]
language = "rust"
source = "builtin"
entry = "cli_dispatch"
wasm = true
wasm_callable = false