[trait]
description = "Portable CLI command processor — shared between WASM and native targets"
version = "v260418.142444"
checksum = "151270d04c08c477cbf16d59bdd52817cfaad4c6c4c028f8c78f7b3bd9ff9b15"
author = "system"
tags = ["kernel", "cli"]
provides = ["kernel/cli"]

[requires]
native = "cli/backend"
wasm = "cli/backend"

[bindings]
native = "sys.cli.native"
wasm = "sys.cli.wasm"

[signature]
params = [
    { name = "line", type = "string", description = "Command line to execute", required = true },
]

[signature.returns]
type = "string"
description = "ANSI-formatted output text"

[implementation]
language = "rust"
source = "builtin"
entry = "cli_dispatch"
wasm = true
wasm_callable = false