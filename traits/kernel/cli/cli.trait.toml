[trait]
description = "Portable CLI command processor — shared between WASM and native targets"
version = "v260415"
checksum = "f0cc5d7b9e9592bc09c9ff931b4b0aa4e8cd9a4a5a58a76d2829f44813046a46"
author = "system"
tags = ["kernel", "cli"]
provides = ["kernel/cli"]

[requires]
native = "cli/backend"
wasm = "cli/backend"

[bindings]
native = "sys.cli.native"
wasm = "sys.cli.wasm"

[signature]
params = [
    { name = "line", type = "string", description = "Command line to execute", required = true },
]

[signature.returns]
type = "string"
description = "ANSI-formatted output text"

[implementation]
language = "rust"
source = "builtin"
entry = "cli_dispatch"
wasm = true
wasm_callable = false