[package]
name = "traits-runtimes"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
bytes = "1"
log = "0.4"
env_logger = "0.11"

# WASM-specific
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "console",
] }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["native"]
native = ["tokio"]
wasm = ["wasm-bindgen", "web-sys", "wasm-bindgen-futures", "js-sys"]

[[example]]
name = "socket_echo"
path = "examples/socket_echo.rs"

[[example]]
name = "file_ops"
path = "examples/file_ops.rs"

[[example]]
name = "multi_target_test"
path = "examples/multi_target_test.rs"
