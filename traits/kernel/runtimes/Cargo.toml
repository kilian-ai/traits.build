[package]
name = "traits-runtimes"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
bytes = "1"
log = "0.4"
env_logger = "0.11"

[features]
default = ["native"]
native = []
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "console",
] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[[example]]
name = "socket_echo"
path = "examples/socket_echo.rs"

[[example]]
name = "file_ops"
path = "examples/file_ops.rs"

[[example]]
name = "multi_target_test"
path = "examples/multi_target_test.rs"
