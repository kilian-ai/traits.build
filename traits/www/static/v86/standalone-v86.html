<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v86 Standalone</title>
<link rel="stylesheet" href="./xterm.css">
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; padding:0; background:#0b0d10; color:#d5d8dc; font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; height:100%; }
  #wrap { display:flex; flex-direction:column; height:100vh; position:relative; }
  #bar { padding:6px 10px; background:#161a1f; border-bottom:1px solid #2a2f36; font-size:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #bar b { color:#fff; }
  #bar select, #bar button { background:#222830; color:#ddd; border:1px solid #3a424d; border-radius:4px; padding:3px 8px; font:inherit; cursor:pointer; }
  #bar button:hover:not(:disabled) { background:#2d343d; }
  #bar button:disabled { opacity:0.4; cursor:not-allowed; }
  #bar .stat { color:#888; margin-left:auto; }
  #term { flex:1; min-height:0; padding:6px 8px; background:#0b0d10; }
  #term .xterm { height:100%; }
  /* viewer overlay sits above #term, fills the same flex slot */
  #viewer-overlay { position:absolute; left:0; right:0; top:36px; bottom:0; display:flex; flex-direction:column; background:#0b0d10; z-index:50; }
  #viewer-overlay[hidden] { display:none; }
  #viewer-bar { display:flex; gap:8px; align-items:center; padding:6px 10px; background:#161a1f; border-bottom:1px solid #2a2f36; font-size:12px; }
  #viewer-bar input { background:#222830; color:#ddd; border:1px solid #3a424d; border-radius:4px; padding:3px 8px; font:inherit; flex:0 1 320px; }
  #viewer-bar button { background:#222830; color:#ddd; border:1px solid #3a424d; border-radius:4px; padding:3px 10px; font:inherit; cursor:pointer; }
  #viewer-bar button:hover { background:#2d343d; }
  #viewer-body { flex:1; min-height:0; display:flex; }
  #viewer-tree { width:280px; overflow:auto; border-right:1px solid #2a2f36; padding:6px 0; font-size:12px; }
  #viewer-tree .row { padding:3px 12px; cursor:pointer; white-space:nowrap; user-select:none; }
  #viewer-tree .row:hover { background:#1a1f25; }
  #viewer-tree .row.sel { background:#22303f; color:#fff; }
  #viewer-tree .dir::before { content:"▸ "; color:#7a8392; }
  #viewer-tree .dir.open::before { content:"▾ "; color:#7a8392; }
  #viewer-tree .file::before { content:"· "; color:#5a6371; }
  #viewer-tree .indent-1 { padding-left:24px; } #viewer-tree .indent-2 { padding-left:36px; } #viewer-tree .indent-3 { padding-left:48px; } #viewer-tree .indent-4 { padding-left:60px; } #viewer-tree .indent-5 { padding-left:72px; }
  #viewer-preview { flex:1; min-width:0; position:relative; background:#0b0d10; }
  #viewer-preview iframe { width:100%; height:100%; border:0; background:#fff; }
  #viewer-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #viewer-empty[hidden] { display:none !important; }
  /* ── social overlay ── */
  #social-overlay { position:absolute; left:0; right:0; top:36px; bottom:0; display:flex; flex-direction:column; background:#0b0d10; z-index:51; }
  #social-overlay[hidden] { display:none; }
  #social-hdr { display:flex; gap:8px; align-items:center; padding:6px 10px; background:#161a1f; border-bottom:1px solid #2a2f36; font-size:12px; }
  #social-hdr button { background:#222830; color:#ddd; border:1px solid #3a424d; border-radius:4px; padding:3px 10px; font:inherit; cursor:pointer; }
  #social-hdr button:hover { background:#2d343d; }
  #social-body { flex:1; min-height:0; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .ss { background:#161a1f; border:1px solid #2a2f36; border-radius:6px; padding:10px 14px; }
  .ss-label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#7a8392; margin-bottom:6px; }
  .social-npub { font-size:11px; color:#4ade80; word-break:break-all; }
  #social-log { margin-top:6px; font-size:11px; max-height:60px; overflow:auto; }
  .slog-line { white-space:pre-wrap; line-height:1.4; }
  #social-body input,#social-body select { background:#222830; color:#ddd; border:1px solid #3a424d; border-radius:4px; padding:3px 8px; font:inherit; }
  #social-body input { flex:1; }
  #social-body button { background:#222830; color:#ddd; border:1px solid #3a424d; border-radius:4px; padding:3px 10px; font:inherit; cursor:pointer; white-space:nowrap; }
  #social-body button:hover:not(:disabled) { background:#2d343d; }
  #social-body button:disabled { opacity:0.4; cursor:not-allowed; }
  .row-flex { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #social-list { display:flex; flex-direction:column; gap:8px; }
  .follow-card { background:#161a1f; border:1px solid #2a2f36; border-radius:6px; padding:10px 14px; }
  .fc-npub { font-size:11px; color:#7ab8f5; word-break:break-all; }
  .fc-meta { font-size:10px; color:#5a6370; word-break:break-all; }
  .fc-actions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  #social-search-results { font-size:11px; margin-top:4px; }
  /* Always reserve scrollbar space so xterm's fit calculation doesn't
     oscillate by 2 cols when a scrollbar appears/disappears. */
  #term .xterm-viewport { background:#0b0d10 !important; overflow-y: scroll !important; }
  #term .xterm-viewport::-webkit-scrollbar { width: 10px; }
  #term .xterm-viewport::-webkit-scrollbar-track { background: #0b0d10; }
  #term .xterm-viewport::-webkit-scrollbar-thumb { background: #2a3240; border-radius: 5px; }
  .hint { color:#6b7380; }
  .ok { color:#4ade80; }
  .err { color:#f87171; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <b>v86</b>
    <label>image:
      <select id="iso">
        <option value="alpine.iso" selected>alpine.iso (48 MB, apk + network)</option>
        <option value="linux4.iso">linux4.iso (7.4 MB, busybox)</option>
        <option value="linux3.iso">linux3.iso (8.2 MB)</option>
        <option value="linux.iso">linux.iso (5.4 MB)</option>
      </select>
    </label>
    <label title="enable emulated NIC tunneled over relay.traits.build WebSocket"><input type="checkbox" id="net" checked> network</label>
    <button id="boot">boot</button>
    <button id="reset" disabled>reset</button>
    <button id="save" disabled>save snapshot</button>
    <button id="restore" disabled>restore</button>
    <button id="clear" disabled>clear snapshot</button>
    <label title="auto-save snapshot ~3s after any serial activity"><input type="checkbox" id="autosave"> auto-save</label>
    <button id="viewer" disabled title="Browse files in /mnt/host (v86 9P share) directly from the host — no relay needed">viewer</button>
    <button id="social" disabled title="Nostr social: publish /mnt/host/public, follow users, sync their content">social</button>
    <span id="status" class="hint">idle</span>
    <span class="stat" id="stats"></span>
  </div>
  <div id="term"></div>
  <div id="viewer-overlay" hidden>
    <div id="viewer-bar">
      <b>viewer</b>
      <span class="hint" style="margin-left:6px">9P share → /mnt/host (in guest)</span>
      <input id="viewer-path" value="/" spellcheck="false" title="path inside the 9P share">
      <button id="viewer-refresh" title="reload listing">refresh</button>
      <span class="hint" id="viewer-status"></span>
      <button id="viewer-close" style="margin-left:auto">close</button>
    </div>
    <div id="viewer-body">
      <div id="viewer-tree"></div>
      <div id="viewer-preview">
        <div id="viewer-empty" class="hint">select a file on the left</div>
        <iframe id="viewer-frame" hidden sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>
  <div id="social-overlay" hidden>
    <div id="social-hdr">
      <b>social</b>
      <span class="hint" style="margin-left:6px">Nostr public-folder sharing — publish /mnt/host/public, follow &amp; sync users</span>
      <button id="social-close" style="margin-left:auto">close</button>
    </div>
    <div id="social-body">
      <!-- identity + controls -->
      <div class="ss">
        <div class="ss-label">identity</div>
        <div id="social-npub-display"><span class="hint">no identity — generate one below</span></div>
        <div class="row-flex" style="margin-top:6px">
          <button id="social-generate">generate identity</button>
          <button id="social-publish" disabled>publish /public</button>
          <button id="social-sync-now" disabled>sync all</button>
          <select id="social-sync-interval">
            <option value="0">auto-sync: off</option>
            <option value="60000">every 1 min</option>
            <option value="300000" selected>every 5 min</option>
            <option value="600000">every 10 min</option>
          </select>
        </div>
        <div id="social-log"></div>
      </div>
      <!-- follow + search -->
      <div class="ss">
        <div class="ss-label">follow</div>
        <div class="row-flex">
          <input id="social-follow-input" placeholder="npub1… paste a public key" spellcheck="false">
          <button id="social-follow-btn">follow</button>
          <input id="social-search-input" placeholder="search by keyword (NIP-50)" spellcheck="false" style="flex:0 1 240px">
          <button id="social-search-btn">search</button>
        </div>
        <div id="social-search-results"></div>
      </div>
      <!-- follow list -->
      <div id="social-list"></div>
    </div>
  </div>
</div>

<script src="./libv86.js"></script>
<script src="./xterm.js"></script>
<script src="./xterm-addon-fit.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const termEl = $('term'), isoEl = $('iso');
  const bootBtn = $('boot'), resetBtn = $('reset'), saveBtn = $('save');
  const restoreBtn = $('restore'), clearBtn = $('clear');
  const autosaveEl = $('autosave');
  const statusEl = $('status'), statsEl = $('stats');

  // ---- xterm.js terminal ----
  const term = new Terminal({
    cursorBlink: true,
    cursorStyle: 'block',
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    fontSize: 13,
    scrollback: 5000,
    convertEol: false,
    allowProposedApi: true,
    theme: {
      background: '#0b0d10',
      foreground: '#d5d8dc',
      cursor: '#d5d8dc',
      cursorAccent: '#0b0d10',
      selectionBackground: '#334155',
      black: '#1e2229', red: '#f87171', green: '#4ade80', yellow: '#facc15',
      blue: '#60a5fa', magenta: '#c084fc', cyan: '#22d3ee', white: '#d5d8dc',
      brightBlack: '#3a424d', brightRed: '#fca5a5', brightGreen: '#86efac', brightYellow: '#fde047',
      brightBlue: '#93c5fd', brightMagenta: '#d8b4fe', brightCyan: '#67e8f9', brightWhite: '#ffffff',
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(termEl);
  setTimeout(() => { try { fit.fit(); } catch (_) {} }, 0);
  const ro = new ResizeObserver(() => { try { fit.fit(); } catch (_) {} });
  ro.observe(termEl);
  window.addEventListener('resize', () => { try { fit.fit(); } catch (_) {} });

  // When fit changes size, push *cols only* to the guest (serial has no WINCH).
  // We deliberately don't push rows: every stty line consumes a row of scrollback,
  // which can itself change xterm's row count → feedback loop. Cols is what
  // matters for line wrapping in shells/ls/pipes; full-screen TUIs (vi/less/top)
  // can set rows manually or ignore it.
  // Deferred until `shellReady` — otherwise xterm's initial resize fires at the
  // ISOLINUX `boot:` prompt and `stty` gets typed there, producing a visible
  // "Loading stty... failed" error before Linux starts.
  let sttyTimer = null, lastCols = 0, sentCols = 0, shellReady = false;
  term.onResize(({ cols }) => {
    lastCols = cols;
    clearTimeout(sttyTimer);
    sttyTimer = setTimeout(() => {
      if (!emulator || !shellReady) return;
      if (lastCols === sentCols) return;
      sentCols = lastCols;
      const cmd = `stty cols ${lastCols} 2>/dev/null\n`;
      for (let i = 0; i < cmd.length; i++) emulator.serial0_send(cmd[i]);
    }, 600);
  });
  let byteCount = 0;

  const setStatus = (msg, cls) => { statusEl.textContent = msg; statusEl.className = cls || 'hint'; };

  // Persist autosave toggle
  autosaveEl.checked = localStorage.getItem('v86.autosave') === '1';
  autosaveEl.onchange = () => {
    localStorage.setItem('v86.autosave', autosaveEl.checked ? '1' : '0');
    if (autosaveEl.checked && emulator) scheduleAutosave();
  };

  const qsIso = new URLSearchParams(location.search).get('iso');
  if (qsIso && [...isoEl.options].some(o => o.value === qsIso)) isoEl.value = qsIso;

  // ---- Terminal output: xterm.js writes raw VT stream as-is ----
  // v86 emits one byte at a time; we batch within a microtask so xterm.js
  // parses multi-byte CSI sequences in a single write() rather than per byte.
  let pendingBytes = [], pendingFlush = false;
  function pushByte(b) {
    pendingBytes.push(b);
    if (!pendingFlush) {
      pendingFlush = true;
      queueMicrotask(() => {
        pendingFlush = false;
        if (!pendingBytes.length) return;
        const u8 = new Uint8Array(pendingBytes);
        pendingBytes = [];
        term.write(u8);
      });
    }
  }

  // ---- IndexedDB snapshot persistence ----
  // Snapshot key is versioned by device topology. Bump SNAP_VER whenever
  // the v86 cfg adds/removes/reorders devices (NIC, 9P filesystem, drives,
  // etc.) — v86 serializes device state into the snapshot, and loading a
  // snapshot taken with a different device set causes a silent boot hang.
  // v2: added `filesystem: {}` (9P virtio share for in-page viewer).
  //
  // RESCUE FLAG: append `?legacy=1` to the URL to boot the pre-v2 device
  // topology AND look up the unversioned `snap:<iso>` key. Use it to recover
  // games/files saved in pre-9P snapshots — boot legacy, copy the file out
  // (e.g. via tunnel, wget upload, or paste into a terminal), then reload
  // without the flag.
  const LEGACY_BOOT = new URLSearchParams(location.search).get('legacy') === '1';
  const SNAP_VER = 'v2';
  const snapKeyFor = iso => LEGACY_BOOT ? ('snap:' + iso) : ('snap:' + iso + ':' + SNAP_VER);
  const DB_NAME = 'v86-snapshots', DB_VER = 1, STORE = 'snaps';
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbGet(key) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
      req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error);
    });
  }
  async function idbPut(key, val) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  }
  async function idbDel(key) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  }
  async function idbHas(key) { return (await idbGet(key)) != null; }

  // ---- Auto-save: debounced snapshot after activity settles ----
  // Live ISOs write to tmpfs, so the only way to "persist FS changes" is
  // to snapshot full VM state. We debounce ~3s of quiet after any serial
  // activity or user input, then save_state() → IDB. Functionally
  // "persists on change" without manual save-button clicks.
  const AUTOSAVE_IDLE_MS = 3000;
  const AUTOSAVE_MIN_GAP_MS = 5000; // never save more than once per 5s
  let autosaveTimer = null, autosaveInFlight = false, lastAutosaveAt = 0, dirty = false;

  function markDirty() {
    dirty = true;
    if (autosaveEl.checked) scheduleAutosave();
  }
  function scheduleAutosave() {
    if (!emulator || autosaveInFlight) return;
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(runAutosave, AUTOSAVE_IDLE_MS);
  }
  async function runAutosave() {
    if (!emulator || autosaveInFlight || !dirty) return;
    const since = Date.now() - lastAutosaveAt;
    if (since < AUTOSAVE_MIN_GAP_MS) {
      autosaveTimer = setTimeout(runAutosave, AUTOSAVE_MIN_GAP_MS - since);
      return;
    }
    autosaveInFlight = true;
    const prevStatus = statusEl.textContent;
    try {
      const t0 = Date.now();
      const st = await emulator.save_state();
      await idbPut(snapKeyFor(currentIso), st);
      lastAutosaveAt = Date.now();
      dirty = false;
      restoreBtn.disabled = false; clearBtn.disabled = false;
      setStatus(`auto-saved ${(st.byteLength/1048576).toFixed(1)} MB (${lastAutosaveAt - t0} ms)`, 'ok');
      // restore prior status after 2s (unless user changed it)
      setTimeout(() => { if (statusEl.textContent.startsWith('auto-saved')) setStatus(prevStatus); }, 2000);
    } catch (e) {
      setStatus('auto-save failed: ' + e.message, 'err');
    } finally { autosaveInFlight = false; }
  }

  // ---- Emulator lifecycle ----
  let emulator = null, currentIso = null;

  // ── DNS interceptor (pure-JS UDP/53 → DoH via relay) ──────────────────────
  // v86's built-in DoH reply injection is broken for us. We hook the emulator
  // bus before WISP sees the packet, answer DNS ourselves via /dns-query on
  // the relay, and inject a correctly framed Ethernet reply via net0-receive.
  function installDnsInterceptor(em) {
    const DNS_ENDPOINT = 'https://relay.traits.build/dns-query';

    // Parse minimal fields from an outgoing Ethernet II frame to detect DNS.
    function parseOutgoingDns(buf) {
      if (!(buf instanceof Uint8Array) || buf.length < 14 + 20 + 8) return null;
      const etype = (buf[12] << 8) | buf[13];
      if (etype !== 0x0800) return null;                     // not IPv4
      const ip0 = 14;
      const ihl = (buf[ip0] & 0x0f) * 4;
      if (ihl < 20) return null;
      if (buf[ip0 + 9] !== 17) return null;                  // not UDP
      const udp0 = ip0 + ihl;
      if (udp0 + 8 > buf.length) return null;
      const dport = (buf[udp0 + 2] << 8) | buf[udp0 + 3];
      if (dport !== 53) return null;
      const sport = (buf[udp0] << 8) | buf[udp0 + 1];
      const ulen  = (buf[udp0 + 4] << 8) | buf[udp0 + 5];
      if (ulen < 8 || udp0 + ulen > buf.length) return null;
      return {
        ethDst: buf.slice(0, 6),
        ethSrc: buf.slice(6, 12),
        ipSrc:  buf.slice(ip0 + 12, ip0 + 16),
        ipDst:  buf.slice(ip0 + 16, ip0 + 20),
        udpSport: sport,
        dnsPayload: buf.slice(udp0 + 8, udp0 + ulen),
      };
    }

    function checksum16(bytes, start, end) {
      let sum = 0;
      for (let i = start; i + 1 < end; i += 2) sum += (bytes[i] << 8) | bytes[i + 1];
      if ((end - start) & 1) sum += bytes[end - 1] << 8;
      while (sum >> 16) sum = (sum & 0xffff) + (sum >> 16);
      return (~sum) & 0xffff;
    }

    function buildDnsReply(q, response) {
      const ipLen  = 20 + 8 + response.length;
      const ethLen = 14 + ipLen;
      const out    = new Uint8Array(ethLen);
      out.set(q.ethSrc, 0);                                  // new dst = old src
      out.set(q.ethDst, 6);                                  // new src = old dst
      out[12] = 0x08; out[13] = 0x00;
      const ip = 14;
      out[ip + 0] = 0x45; out[ip + 1] = 0x00;
      out[ip + 2] = (ipLen >> 8) & 0xff; out[ip + 3] = ipLen & 0xff;
      out[ip + 8] = 64; out[ip + 9] = 17;
      out.set(q.ipDst, ip + 12);                             // src = old dst
      out.set(q.ipSrc, ip + 16);                             // dst = old src
      const ipc = checksum16(out, ip, ip + 20);
      out[ip + 10] = (ipc >> 8) & 0xff; out[ip + 11] = ipc & 0xff;
      const udp = ip + 20;
      out[udp + 0] = 0; out[udp + 1] = 53;
      out[udp + 2] = (q.udpSport >> 8) & 0xff; out[udp + 3] = q.udpSport & 0xff;
      const ulen = 8 + response.length;
      out[udp + 4] = (ulen >> 8) & 0xff; out[udp + 5] = ulen & 0xff;
      // UDP checksum is optional for IPv4 — leave as 0.
      out.set(response, udp + 8);
      return out;
    }

    async function handleDnsQuery(q) {
      try {
        const resp = await fetch(DNS_ENDPOINT, {
          method: 'POST',
          headers: { 'content-type': 'application/dns-message' },
          body: q.dnsPayload,
        });
        if (!resp.ok) { console.warn('[dns] upstream status', resp.status); return; }
        const ab = await resp.arrayBuffer();
        const reply = buildDnsReply(q, new Uint8Array(ab));
        em.bus.send('net0-receive', reply);
      } catch (e) {
        console.warn('[dns] fetch failed', e);
      }
    }

    // Hook net0-send. v86's BusConnector stores listeners as an array on
    // `listeners[topic]` and dispatches to all of them. To avoid double-sending
    // non-DNS packets, we REPLACE the array: save v86's existing listener,
    // then install ours as the sole listener (which forwards to v86 for
    // non-DNS packets).
    const tryHook = () => {
      if (!em.bus) return false;
      const l = em.bus.listeners;
      if (!l || !l['net0-send'] || !l['net0-send'].length) return false;
      const prev = l['net0-send'][l['net0-send'].length - 1];
      const hijacker = {
        fn: (data) => {
          const buf = data instanceof ArrayBuffer ? new Uint8Array(data) : data;
          const q = parseOutgoingDns(buf);
          if (q) { handleDnsQuery(q); return; }
          if (prev) prev.fn.call(prev.this_value, data);
        },
        this_value: this,
      };
      l['net0-send'] = [hijacker];
      console.log('[dns] interceptor installed, replaced v86 listener');
      return true;
    };
    // The adapter registers net0-send from its constructor, which runs inside
    // `new V86(cfg)`, so by the time we call installDnsInterceptor() the
    // listener is already there. Retry a few times just in case.
    if (!tryHook()) {
      let tries = 0;
      const iv = setInterval(() => {
        if (tryHook() || ++tries > 20) clearInterval(iv);
      }, 100);
    }
  }

  async function boot(opts = {}) {
    const iso = isoEl.value;
    currentIso = iso;
    const snapKey = snapKeyFor(iso);
    const doRestore = opts.restore && await idbHas(snapKey);

    setStatus(doRestore ? `restoring ${iso}…` : `booting ${iso}…`);
    bootBtn.disabled = true; isoEl.disabled = true;

    byteCount = 0;
    term.reset();

    // Alpine runs diskless from the ISO — rootfs is tmpfs sized at 50% of RAM
    // by default. 512 MB was tight (rootfs capped at 244 MB, ENOSPC during
    // `npm install -g`, and node/npm got OOM-killed). 1024 MB gave a ~500 MB
    // rootfs but large npm packages (openclaw has 7231 files across dozens of
    // transitive deps) still fill it. 2048 MB gives a ~1 GB rootfs and plenty
    // of process headroom. Tiny busybox ISOs still run on 128.
    // Some browsers/v86 builds fail ISOLINUX boot at >=4096 MB, so we cap
    // Alpine memory at 3584 MB for stability.
    // Override with ?mem=<MB> for debugging.
    const isAlpine = /^alpine/i.test(iso);
    const memOverride = parseInt(new URLSearchParams(location.search).get('mem') || '', 10);
    const maxStableAlpineMemMB = 3584;
    const requestedMemMB = Number.isFinite(memOverride) && memOverride > 0
      ? memOverride
      : (isAlpine ? 2048 : 128);
    const memMB = isAlpine
      ? Math.min(requestedMemMB, maxStableAlpineMemMB)
      : requestedMemMB;
    if (isAlpine && requestedMemMB > maxStableAlpineMemMB) {
      console.warn(`[boot] requested mem=${requestedMemMB}MB exceeds stable cap; using ${memMB}MB`);
      setStatus(`requested ${requestedMemMB}MB; capped to ${memMB}MB for stable boot`);
    }
    const cfg = {
      wasm_path: './v86.wasm',
      bios:     { url: './seabios.bin' },
      vga_bios: { url: './vgabios.bin' },
      cdrom:    { url: './' + iso },
      memory_size: memMB * 1024 * 1024,
      vga_memory_size: 4 * 1024 * 1024,
      autostart: true,
      disable_mouse: true,
      // Empty 9P virtio filesystem. Mounts in the guest as the virtio tag
      // `host9p`. We use it to expose files between guest and host browser:
      // the guest writes to /mnt/host/* and the host reads via
      // emulator.fs9p.read_dir() / read_file() — no relay or websocat
      // needed. The viewer overlay button uses this directly.
      // Skipped in legacy mode so device topology matches v1 snapshots.
      ...(LEGACY_BOOT ? {} : { filesystem: {} }),
    };
    // Optional: route emulated NIC through our Cloudflare relay so `apk add`, wget, etc. work.
    // Default backend is WISP (TCP tunneled over a single WebSocket) backed by
    // cloudflare:sockets on the relay worker, so real TCP to anywhere on the
    // internet works. Legacy wsproxy (raw Ethernet) URLs starting with ws:// or
    // wss:// are still honored via localStorage/?relay= override.
    const netEl = document.getElementById('net');
    // Migrate legacy relay URLs to the Fly.io WISP endpoint. The Cloudflare
    // Worker relay (wisps://relay.traits.build/wisp) cannot reach CF-fronted
    // hosts like api.openai.com due to CF's loopback-prevention block on
    // Worker→CF-IP connect(). The Fly.io backend uses tokio::net::TcpStream
    // and has no such restriction.
    // The Fly backend speaks WISP v1, so the URL MUST use wisps:// (secure)
    // or wisp:// — v86's src/browser/network.js picks WispNetworkAdapter only
    // for those schemes. A plain wss:// URL silently falls back to the legacy
    // raw-Ethernet NetworkAdapter, which sends DHCP/ARP frames our WISP server
    // does not understand (guest then never gets a DHCP lease).
    try {
      const stored = localStorage.getItem('v86.relay-url') || '';
      if (stored && (
        /relay\.traits\.build\/(x\/sys|x\/net|linux\/tunnel|wisp)\/?$/.test(stored) ||
        /^wisps?:\/\/relay\.traits\.build\/wisp\/?$/.test(stored) ||
        /^wss?:\/\/apptron-traits-build\.fly\.dev\/wisp\/?$/.test(stored)
      )) {
        localStorage.setItem('v86.relay-url', 'wisps://apptron-traits-build.fly.dev/wisp');
      }
    } catch(_) {}
    const relayUrl = new URLSearchParams(location.search).get('relay')
      || localStorage.getItem('v86.relay-url')
      || 'wisps://apptron-traits-build.fly.dev/wisp';
    if (netEl && netEl.checked) {
      // v86 selects the backend from the URL scheme:
      //   wisp://, wisps://  → WispNetworkAdapter (TCP tunneling)
      //   ws://, wss://      → NetworkAdapter (raw Ethernet wsproxy, legacy)
      //   "fetch"            → FetchNetworkAdapter (no server, HTTP-only via CORS)
      // NOTE: v86 only creates a NIC when net_device.type is set explicitly to
      // "ne2k" or "virtio" (the "default to ne2k" fallback only fires when
      // net_device is completely absent — see src/browser/starter.js and
      // src/cpu.js). Passing a net_device object without a type silently
      // creates NO NIC.
      //
      // What works with the config below:
      //   - NIC bring-up, DHCP lease (192.168.86.100)
      //   - ICMP (ping 1.1.1.1)
      //   - TCP (real sockets via WISP to cloudflare:sockets)
      //   - DNS via DoH proxied through our relay at /dns-query
      //
      // The relay /dns-query endpoint wraps 1.1.1.1 and adds CORS headers that
      // satisfy the browser's preflight. A direct fetch from the page to
      // cloudflare-dns.com would be rejected by CORS preflight in many contexts
      // (file:// origins, private-network access), which is why the default
      // v86 DoH path silently fails.
      cfg.net_device = {
        type: 'ne2k',
        relay_url: relayUrl,
        // Route v86's DoH through our relay. v86 builds the URL as
        //   https://{doh_server}/dns-query
        // so we just pass the relay's hostname here.
        dns_method: 'doh',
        doh_server: 'relay.traits.build',
        // cors_proxy is only used by the "fetch" backend; safe to always set.
        cors_proxy: 'https://relay.traits.build/cors?url=',
      };
    }
    if (doRestore) {
      const blob = await idbGet(snapKey);
      cfg.initial_state = { buffer: blob };
    }

    emulator = new V86(cfg);
    window.emulator = emulator;

    // ── DNS interceptor ─────────────────────────────────────────────────────
    // v86's WispNetworkAdapter has a built-in DoH path (handle_fake_dns_doh)
    // but its synthesised UDP reply isn't delivered to the guest resolver in
    // the current v86 build. We bypass it entirely: peek at outbound Ethernet
    // frames on the bus, detect UDP/53 queries, fetch DoH through our relay,
    // and inject the reply back onto the receive side with correct framing.
    installDnsInterceptor(emulator);

    emulator.add_listener('emulator-ready',   () => setStatus('ready'));
    emulator.add_listener('emulator-started', () => setStatus(doRestore ? 'restored' : 'running', 'ok'));
    emulator.add_listener('emulator-stopped', () => setStatus('stopped'));

    // ── Restore-path instrumentation ───────────────────────────────────────
    // Visible in browser console. Captures WispNetworkAdapter WS lifecycle so
    // we can see whether the tunnel reattaches cleanly on restore.
    if (doRestore) {
      console.log('[restore] boot invoked restore=true, snapKey=', snapKey);
      // Peek at the adapter's internal WebSocket (v86 stashes it on
      // emulator.network_adapter.wisp_network.wisp_url / websocket).
      setTimeout(() => {
        try {
          const na = emulator.network_adapter;
          const wn = na && (na.wisp_network || na.wisp || null);
          const ws = wn && (wn.websocket || wn.ws || null);
          console.log('[restore] adapter snapshot', {
            adapter: na ? na.constructor && na.constructor.name : null,
            wisp:    wn ? Object.keys(wn) : null,
            ws_state: ws ? ws.readyState : null,
            ws_url:   ws ? ws.url : null,
            relay:    cfg.net_device && cfg.net_device.relay_url,
          });
        } catch (e) { console.warn('[restore] adapter peek failed', e); }
      }, 500);
    }
    // Auto-init network on first shell prompt.
    // Fresh boot: full setup (DHCP + repos + apk upgrade guidance).
    // Snapshot restore: lightweight NIC recovery (DHCP refresh + resolv.conf)
    // to fix stale tunnel/DHCP state after restore.
    let netInited = !(netEl && netEl.checked);
    // On restore the shell is already up, so enable stty sync immediately.
    if (doRestore) shellReady = true;

    // Build the net-init command (fresh boot vs snapshot restore).
    function buildNetInitCmd() {
      const rootfsParam = (new URLSearchParams(location.search).get('rootfs') || '').trim();
      const rootfsSize = rootfsParam || (isAlpine ? '4G' : '');
      const rootfsCmd = rootfsSize
        ? `mount -o remount,size=${rootfsSize} / >/dev/null 2>&1; echo "[rootfs] remounted / as ${rootfsSize}"; `
        : '';
      // Fresh Alpine live ISO ships with only /media/cdrom/apks as an apk repo
      // and a stale libcrypto that breaks any `apk add nodejs` (EVP_MD_CTX_get_size_ex
      // symbol mismatch). On first boot, once DHCP succeeds, wire latest-stable
      // main+community, run `apk upgrade`, then notify the terminal. Opt out with ?setup=0.
      const skipSetup = (new URLSearchParams(location.search).get('setup') === '0');
      const setupCmd = skipSetup ? '' :
        ' { ' +
          'printf "%s\\n" ' +
            '"https://dl-cdn.alpinelinux.org/alpine/latest-stable/main" ' +
            '"https://dl-cdn.alpinelinux.org/alpine/latest-stable/community" ' +
            '> /etc/apk/repositories && ' +
         'apk update &&' +
         'echo "[setup] apk upgrade (rebasing libc/libcrypto)…" && ' +
          'apk upgrade --available 2>&1 | tail -3 && ' +
          'echo "[setup] ready — apk add <pkg> works now. snapshot to skip on next boot."; ' +
        '} ';
      // Snapshot restore: WISP WebSocket is freshly reconnected (JS adapter
      // is not in the x86 snapshot), and the Wisp router config is known
      // and fixed: guest IP 192.168.86.100/24, gateway 192.168.86.1, router
      // MAC 52:54:00:01:02:03. A backgrounded `udhcpc` detached subshell
      // never completed and left the guest with no IP and no route — so
      // instead we apply deterministic static config in one shot. This is
      // non-blocking (no RTNL wait, no DHCP round-trip), idempotent, and
      // leaves the guest immediately able to open TCP streams through the
      // freshly-registered WispNetworkAdapter. DoH `doh_server` is already
      // handled by the adapter itself (`dns_method: 'doh'`), so resolv.conf
      // here is only a belt-and-braces fallback for glibc/musl name lookup
      // that bypasses the DoH interceptor.
      //
      // CRITICAL: bounce eth0 BEFORE configuring IP. The WispNetworkAdapter
      // learns the guest NIC's MAC via a `net0-mac` bus event that ne2k
      // fires on driver init. On snapshot restore the ne2k driver is
      // already loaded (x86 state) and does NOT re-emit `net0-mac`, so
      // the fresh adapter keeps a stale/zero vm_mac and silently drops
      // frames. `ip link down/up` re-initializes the NE2K, re-fires the
      // MAC announcement, and resets the adapter's RX/TX ring state.
      // Without this bounce even `ping 192.168.86.1` (virtual gateway)
      // fails 100% post-restore.
      // Retry loop for the eth0 up: empirically, the first `ip link set eth0
      // up` after snapshot restore sometimes silently fails (interface stays
      // DOWN) because the NE2K driver + fresh WispNetworkAdapter handshake
      // is racy. A second `up` after a longer settle always succeeds. We
      // poll `/sys/class/net/eth0/operstate` up to 5 times and redo the up
      // until it reports non-`down`.
      // Mount the v86 9P share at /mnt/host so the host browser viewer can
      // read files written by the guest without going through the relay.
      // - msize: 8KB chunks (small but reliable; v86 9P doesn't like big msize)
      // - cache=loose: avoids excessive flushes for write-heavy workloads
      // - access=any: don't require uid/gid mapping
      // The symlink puts a `~/host` shortcut in $HOME for ergonomic access.
      const mount9pCmd =
        'mkdir -p /mnt/host 2>/dev/null; ' +
        'mountpoint -q /mnt/host || ' +
          'mount -t 9p -o trans=virtio,version=9p2000.L,msize=8192,cache=loose,access=any,dfltuid=0,dfltgid=0,rw host9p /mnt/host 2>/dev/null; ' +
        'ln -sfn /mnt/host /home/root/host 2>/dev/null; ' +
        'mkdir -p /mnt/host/public 2>/dev/null; ';

      const restoreNetCmd =
        rootfsCmd +
        mount9pCmd +
        'killall -q udhcpc 2>/dev/null; ' +
        'ip link set eth0 down 2>/dev/null; sleep 1; ' +
        'for i in 1 2 3 4 5; do ' +
          'ip link set eth0 up 2>/dev/null; sleep 1; ' +
          'st=$(cat /sys/class/net/eth0/operstate 2>/dev/null); ' +
          'fl=$(cat /sys/class/net/eth0/flags 2>/dev/null); ' +
          '[ "$st" != "down" ] && break; ' +
        'done; ' +
        'ip addr flush dev eth0 2>/dev/null; ' +
        'ip addr add 192.168.86.100/24 dev eth0; ' +
        'ip route replace default via 192.168.86.1 dev eth0 2>/dev/null; ' +
        'arp -d 192.168.86.1 2>/dev/null; ' +
        'arp -s 192.168.86.1 52:54:00:01:02:03; ' +
        'printf "nameserver 1.1.1.1\\nnameserver 1.0.0.1\\n" > /etc/resolv.conf; ' +
        'echo "[restore-net] eth0 operstate=$st flags=$fl (retries=$i)"; ';

      const freshBootCmd =
        rootfsCmd +
        mount9pCmd +
        'ip link set eth0 up 2>/dev/null; ' +
        'udhcpc -i eth0 -q -n -f -T 2 -t 3 >/dev/null 2>&1; ' +
        'printf "nameserver 1.1.1.1\\nnameserver 1.0.0.1\\n" > /etc/resolv.conf; ' +
        'clear; ' + setupCmd;

      return (doRestore ? restoreNetCmd : freshBootCmd) + '\n';
    }

    function sendCmd(cmd) {
      for (let i = 0; i < cmd.length; i++) emulator.serial0_send(cmd[i]);
    }

    function runNetInit() {
      if (netInited) return;
      netInited = true;
      sendCmd(buildNetInitCmd());
    }

    let promptTail = '';
    const PROMPT_RE = /[#$]\s$/;
    emulator.add_listener('serial0-output-byte', b => {
      byteCount++; pushByte(b); markDirty();
      if (!shellReady || !netInited) {
        promptTail = (promptTail + String.fromCharCode(b)).slice(-24);
        if (PROMPT_RE.test(promptTail) && /localhost|alpine|~/.test(promptTail)) {
          if (!shellReady) {
            shellReady = true;
            // Prime stty with current cols now that we know we're at a shell.
            if (lastCols && emulator) {
              sentCols = lastCols;
              const cmd = `stty cols ${lastCols} 2>/dev/null\n`;
              setTimeout(() => sendCmd(cmd), 300);
            }
          }
          if (!netInited) {
            setTimeout(runNetInit, 600);
          }
        }
      }
    });

    // On restore the guest is idle at the shell prompt (HLT) and will not
    // emit any serial output until input wakes it up — so PROMPT_RE above
    // never fires. We also can't rely on `emulator-started`: when v86 boots
    // from a preloaded `initial_state` buffer, that event can fire before
    // all our listeners are attached, so a listener registered later simply
    // misses it (observed on 2nd+ back-to-back restores). Just schedule the
    // kicker on a plain timer — `runNetInit` is idempotent via `netInited`.
    if (doRestore && !netInited) {
      setTimeout(() => { if (emulator) sendCmd('\n'); }, 400);
      setTimeout(runNetInit, 1400);
    }

    resetBtn.disabled = false;
    saveBtn.disabled = false;
    restoreBtn.disabled = !(await idbHas(snapKey));
    clearBtn.disabled = restoreBtn.disabled;

    term.focus();
  }

  async function shutdown() {
    if (!emulator) return;
    try { emulator.stop(); } catch (_) {}
    try { emulator.destroy(); } catch (_) {}
    emulator = null; window.emulator = null;
    shellReady = false; sentCols = 0;
  }

  async function doReset() { await shutdown(); await boot({ restore: false }); }
  async function doRestore() { await shutdown(); await boot({ restore: true }); }
  async function doClear() {
    await idbDel(snapKeyFor(currentIso));
    setStatus('snapshot cleared');
    restoreBtn.disabled = true; clearBtn.disabled = true;
  }
  async function doSave() {
    if (!emulator) return;
    saveBtn.disabled = true;
    setStatus('saving snapshot…');
    try {
      const buf = await emulator.save_state();
      await idbPut(snapKeyFor(currentIso), buf);
      setStatus(`snapshot saved (${(buf.byteLength/1048576).toFixed(1)} MB)`, 'ok');
      restoreBtn.disabled = false; clearBtn.disabled = false;
    } catch (e) {
      setStatus('save failed: ' + e.message, 'err');
    } finally { saveBtn.disabled = false; }
  }

  bootBtn.onclick    = () => boot({ restore: false });
  resetBtn.onclick   = doReset;
  saveBtn.onclick    = doSave;
  restoreBtn.onclick = doRestore;
  clearBtn.onclick   = doClear;

  isoEl.onchange = async () => {
    const has = await idbHas(snapKeyFor(isoEl.value));
    setStatus(has ? `snapshot available for ${isoEl.value}` : 'no snapshot for this image');
  };
  isoEl.dispatchEvent(new Event('change'));

  // ---- Keyboard input: xterm.js streams raw VT input directly ----
  // term.onData fires with a string containing already-encoded VT sequences
  // (arrow keys → ESC[A, Ctrl-C → \x03, etc.), so we just forward bytes.
  term.onData(data => {
    if (!emulator) return;
    for (let i = 0; i < data.length; i++) emulator.serial0_send(data[i]);
    markDirty();
  });
  termEl.addEventListener('click', () => term.focus());

  setInterval(() => { statsEl.textContent = emulator ? `${byteCount} bytes` : ''; }, 500);

  // ─────────────────────────────────────────────────────────────────────────
  // Viewer overlay — browse files in the v86 9P share directly from the host.
  // No relay/tunnel/websocat needed. Files the guest writes to /mnt/host/*
  // appear here on the next refresh.
  // ─────────────────────────────────────────────────────────────────────────
  const viewerBtn   = $('viewer');
  const overlay     = $('viewer-overlay');
  const treeEl      = $('viewer-tree');
  const frameEl     = $('viewer-frame');
  const emptyEl     = $('viewer-empty');
  const pathEl      = $('viewer-path');
  const refreshBtn  = $('viewer-refresh');
  const closeBtn    = $('viewer-close');
  const vStatusEl   = $('viewer-status');
  let lastBlobUrl   = null;
  const expanded    = new Set(['/']);

  function vSet(msg, cls) { vStatusEl.textContent = msg || ''; vStatusEl.className = 'hint ' + (cls || ''); }

  function fs9p() { return emulator && emulator.fs9p; }
  function joinPath(base, name) {
    if (base === '/' || base === '') return '/' + name;
    return base.replace(/\/+$/, '') + '/' + name;
  }
  function isDir(path) {
    const fs = fs9p(); if (!fs) return false;
    const r = fs.SearchPath(path);
    if (!r || r.id === -1) return false;
    return fs.IsDirectory(r.id);
  }
  function listDir(path) {
    const fs = fs9p(); if (!fs) return [];
    const names = fs.read_dir(path) || [];
    return names.map(n => {
      const p = joinPath(path, n);
      return { name: n, path: p, dir: isDir(p) };
    }).sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
  }

  function renderTree() {
    if (!fs9p()) { treeEl.innerHTML = '<div class="row hint" style="padding:8px 12px">9P share not ready</div>'; return; }
    const root = (pathEl.value || '/').replace(/\/+$/, '') || '/';
    if (!isDir(root)) {
      treeEl.innerHTML = `<div class="row hint" style="padding:8px 12px">not a directory: ${root}</div>`;
      return;
    }
    expanded.add(root);
    const out = [];
    function walk(dirPath, depth) {
      for (const e of listDir(dirPath)) {
        const cls = e.dir ? ('dir' + (expanded.has(e.path) ? ' open' : '')) : 'file';
        const indent = depth > 5 ? 5 : depth;
        out.push(`<div class="row ${cls} indent-${indent}" data-path="${e.path}" data-dir="${e.dir ? 1 : 0}">${e.name}</div>`);
        if (e.dir && expanded.has(e.path)) walk(e.path, depth + 1);
      }
    }
    walk(root, 1);
    treeEl.innerHTML = out.join('') || '<div class="row hint" style="padding:8px 12px">empty</div>';
  }

  function mimeFor(path) {
    const ext = (path.split('.').pop() || '').toLowerCase();
    return ({
      html:'text/html', htm:'text/html',
      js:'text/javascript', mjs:'text/javascript',
      css:'text/css', json:'application/json',
      svg:'image/svg+xml', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',
      gif:'image/gif', webp:'image/webp', ico:'image/x-icon',
      txt:'text/plain', md:'text/plain', log:'text/plain',
      pdf:'application/pdf', wasm:'application/wasm',
    })[ext] || 'text/plain;charset=utf-8';
  }

  async function openFile(path) {
    const fs = fs9p(); if (!fs) return;
    vSet('loading ' + path);
    let data;
    try { data = await fs.read_file(path); } catch (e) { vSet('error: ' + e.message, 'err'); return; }
    if (!data) { vSet('empty or missing: ' + path, 'err'); return; }
    if (lastBlobUrl) { try { URL.revokeObjectURL(lastBlobUrl); } catch (_) {} lastBlobUrl = null; }
    const blob = new Blob([data], { type: mimeFor(path) });
    lastBlobUrl = URL.createObjectURL(blob);
    frameEl.src = lastBlobUrl;
    frameEl.hidden = false;
    emptyEl.hidden = true;
    vSet(`${path} (${data.length} bytes)`, 'ok');
  }

  treeEl.addEventListener('click', e => {
    const row = e.target.closest('.row'); if (!row) return;
    const path = row.dataset.path;
    if (row.dataset.dir === '1') {
      if (expanded.has(path)) expanded.delete(path); else expanded.add(path);
      renderTree();
    } else {
      treeEl.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel'));
      row.classList.add('sel');
      openFile(path);
    }
  });
  refreshBtn.onclick = () => { renderTree(); vSet('reloaded'); };
  pathEl.onkeydown = e => { if (e.key === 'Enter') { renderTree(); } };
  closeBtn.onclick = () => { overlay.hidden = true; term.focus(); };
  viewerBtn.onclick = () => {
    if (!fs9p()) { setStatus('9P share not available — boot v86 first', 'err'); return; }
    // Default to the public seed dir if it exists, otherwise root.
    if (pathEl.value === '/' && isDir('/public')) pathEl.value = '/public';
    overlay.hidden = false;
    renderTree();
    vSet('ready');
  };
  // Toggle viewer button availability when emulator boots/stops.
  function syncViewerBtn() { viewerBtn.disabled = !emulator; }
  setInterval(syncViewerBtn, 800);

  // ─────────────────────────────────────────────────────────────────────────
  // Social — Nostr public-folder sharing via /mnt/host
  // - Identity (nsec/npub) stored in localStorage
  // - Publish: read /mnt/host/public via fs9p, sha256 each file, sign a
  //   kind-30000 manifest event, broadcast to Nostr relays
  // - Follow: store npub list, create /mnt/host/following/<npub>/ in 9P
  // - Sync: REQ kind-30000 from relays, fetch files via tunnel HTTP proxy,
  //   write to /mnt/host/following/<npub>/
  // - Auto-sync: setInterval
  // ─────────────────────────────────────────────────────────────────────────
  const SOCIAL_NSEC_KEY      = 'traits.secret.NOSTR_NSEC';
    // ── Local JS Nostr crypto (secp256k1 schnorr + bech32) — no server needed ──
    (function() {
      const P  = BigInt('0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFC2F');
      const N  = BigInt('0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141');
      const Gx = BigInt('0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798');
      const Gy = BigInt('0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8');
      const mod = (a, m = P) => { const r = a % m; return r < 0n ? r + m : r; };
      const pow = (b, e, m) => { let r = 1n; b %= m; while (e > 0n) { if (e & 1n) r = r * b % m; e >>= 1n; b = b * b % m; } return r; };
      const inv = (n, m = P) => pow(mod(n, m), m - 2n, m);
      const b2h = b => Array.from(b).map(x => x.toString(16).padStart(2,'0')).join('');
      const h2b = h => Uint8Array.from(h.match(/.{2}/g).map(c => parseInt(c,16)));
      const n2b = n => h2b(n.toString(16).padStart(64,'0'));
      const b2n = b => BigInt('0x' + b2h(b));
      class Pt {
        constructor(x,y,z=1n){this.x=x;this.y=y;this.z=z;}
        static Z = new Pt(0n,1n,0n);
        static G = new Pt(Gx,Gy);
        af(){if(this.z===1n)return this;const iz=inv(this.z);return new Pt(mod(this.x*iz),mod(this.y*iz));}
        dbl(){const{x,y,z}=this,YY=mod(y*y),S=mod(4n*x*YY),M=mod(3n*x*x),x2=mod(M*M-2n*S),y2=mod(M*(S-x2)-8n*YY*YY),z2=mod(2n*y*z);return new Pt(x2,y2,z2);}
        add(Q){if(!this.z)return Q;if(!Q.z)return this;const{x:X1,y:Y1,z:Z1}=this,{x:X2,y:Y2,z:Z2}=Q,U1=mod(X1*Z2*Z2),U2=mod(X2*Z1*Z1),S1=mod(Y1*Z2*Z2*Z2),S2=mod(Y2*Z1*Z1*Z1),H=mod(U2-U1),R=mod(S2-S1);if(!H)return R?Pt.Z:this.dbl();const H2=mod(H*H),H3=mod(H*H2),x3=mod(R*R-H3-2n*U1*H2),y3=mod(R*(U1*H2-x3)-S1*H3),z3=mod(H*Z1*Z2);return new Pt(x3,y3,z3);}
        mul(k){let n=mod(k,N),Q=Pt.Z,P=this;while(n>0n){if(n&1n)Q=Q.add(P);P=P.dbl();n>>=1n;}return Q;}
        get xo(){return this.af().x;}
        get ya(){return this.af().y;}
      }
      const sha256 = async b => new Uint8Array(await crypto.subtle.digest('SHA-256', b));
      // bech32
      const CS='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const GN=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
      function b32poly(v){let c=1;for(const x of v){const t=c>>25;c=(c&0x1ffffff)<<5^x;for(let i=0;i<5;i++)if((t>>i)&1)c^=GN[i];}return c;}
      function b32hrp(s){const r=[];for(const c of s)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of s)r.push(c.charCodeAt(0)&31);return r;}
      function b32enc(hrp,ws){const c=[...ws,0,0,0,0,0,0],ck=b32poly([...b32hrp(hrp),...c])^1,cs=Array.from({length:6},(_,i)=>(ck>>(5*(5-i)))&31);return hrp+'1'+[...ws,...cs].map(d=>CS[d]).join('');}
      function b32dec(s){s=s.toLowerCase();const p=s.lastIndexOf('1'),ws=s.slice(p+1).split('').map(c=>CS.indexOf(c));return{hrp:s.slice(0,p),words:ws.slice(0,-6)};}
      function b2w(bytes){let a=0,b=0;const r=[];for(const x of bytes){a=(a<<8)|x;b+=8;while(b>=5){b-=5;r.push((a>>b)&31);}}if(b>0)r.push((a<<(5-b))&31);return r;}
      function w2b(ws){let a=0,b=0;const r=[];for(const w of ws){a=(a<<5)|w;b+=5;while(b>=8){b-=8;r.push((a>>b)&0xff);}}return new Uint8Array(r);}
      // schnorr sign (BIP-340)
      async function schnorrSign(privHex, msgBytes) {
        const d = b2n(h2b(privHex));
        const P0 = Pt.G.mul(d);
        // deterministic nonce: SHA256(privkey || msg)
        const k0 = mod(b2n(await sha256(new Uint8Array([...n2b(d), ...msgBytes]))), N);
        const k = k0 === 0n ? 1n : k0;
        const R = Pt.G.mul(k);
        const kf = R.ya % 2n !== 0n ? N - k : k;
        const rx = R.xo;
        const px = P0.xo;
        const eIn = new Uint8Array([...n2b(rx), ...n2b(px), ...msgBytes]);
        const e = mod(b2n(await sha256(eIn)), N);
        const s = mod(kf + e * d, N);
        return new Uint8Array([...n2b(rx), ...n2b(s)]);
      }
      window._nostrLocalCrypto = {
        async keygen() {
          const priv = new Uint8Array(32); crypto.getRandomValues(priv);
          // ensure scalar < N (rejection sampling would be purer but this is safe enough for 32 bytes)
          const privKey = mod(b2n(priv), N - 1n) + 1n;
          const pub = Pt.G.mul(privKey).xo;
          return { nsec: n2b(privKey).reduce((s,x)=>s+x.toString(16).padStart(2,'0'),''), npub: n2b(pub).reduce((s,x)=>s+x.toString(16).padStart(2,'0'),'') };
        },
        async pubkey(nsecHex) { return n2b(Pt.G.mul(b2n(h2b(nsecHex))).xo).reduce((s,x)=>s+x.toString(16).padStart(2,'0'),''); },
        async encode_npub(pubHex) { return b32enc('npub', b2w(h2b(pubHex))); },
        async decode_npub(npub) { const {words} = b32dec(npub); return b2h(w2b(words)); },
        async sign_event(nsecHex, kind, content, tagsJson, createdAt) {
          const pubHex = await this.pubkey(nsecHex);
          const kindInt = parseInt(kind), tags = JSON.parse(tagsJson), ts = parseInt(createdAt) || Math.floor(Date.now()/1000);
          const canonical = JSON.stringify([0, pubHex, ts, kindInt, tags, content]);
          const idBytes = await sha256(new TextEncoder().encode(canonical));
          const id = b2h(idBytes);
          const sig = b2h(await schnorrSign(nsecHex, idBytes));
          return { id, pubkey: pubHex, created_at: ts, kind: kindInt, tags, content, sig };
        },
      };
    })();

  const SOCIAL_FOLLOWING_KEY = 'traits.nostr.following';
  const NOSTR_RELAYS = [
    'wss://relay.damus.io',
    'wss://nos.lol',
    'wss://relay.nostr.band',
  ];
  let socialSyncTimer = null;

  // social.nostr REST dispatch
  async function nostrRest(action, ...args) {
    const res = await fetch('https://traits-build.fly.dev/traits/social/nostr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ args: [action, ...args] }),
    });
    const j = await res.json();
    if (j && j.result !== undefined) return j.result;
    return j;
  }

  // Try local JS crypto (offline, no server) → WASM SDK → REST fallback
  async function nostrCall(action, ...args) {
    const local = window._nostrLocalCrypto;
    if (local && typeof local[action] === 'function') {
      try { return await local[action](...args); } catch (e) { console.warn('nostr local err:', e); }
    }
    try {
      const sdk = window._traitsSDK;
      if (sdk) {
        const r = await sdk.call('social.nostr', [action, ...args]);
        if (r !== null && r !== undefined) return r;
      }
    } catch (_) {}
    return nostrRest(action, ...args);
  }

  // Minimal NIP-01 REQ — returns array of matching events from all relays
  function nostrReq(relays, filter, timeoutMs = 7000) {
    return new Promise(resolve => {
      const events = [];
      let done = 0;
      const total = relays.length;
      if (!total) { resolve([]); return; }
      const finish = () => { if (++done >= total) resolve(events); };
      const subId = Math.random().toString(36).slice(2, 9);
      for (const url of relays) {
        let ws;
        const timer = setTimeout(() => { try { ws.close(); } catch (_) {} }, timeoutMs);
        try {
          ws = new WebSocket(url);
          ws.onopen = () => ws.send(JSON.stringify(['REQ', subId, filter]));
          ws.onmessage = e => {
            try {
              const msg = JSON.parse(e.data);
              if (msg[0] === 'EVENT' && msg[1] === subId) events.push(msg[2]);
              if (msg[0] === 'EOSE'  && msg[1] === subId) { clearTimeout(timer); ws.close(); }
            } catch (_) {}
          };
          ws.onclose = () => { clearTimeout(timer); finish(); };
          ws.onerror = () => { clearTimeout(timer); try { ws.close(); } catch (_) {} };
        } catch (_) { finish(); }
      }
    });
  }

  // Broadcast a signed event to all relays
  function nostrPublish(relays, event) {
    return Promise.all(relays.map(url => new Promise(resolve => {
      let ws;
      const timer = setTimeout(() => { try { ws.close(); } catch (_) {} resolve(); }, 7000);
      try {
        ws = new WebSocket(url);
        ws.onopen  = () => ws.send(JSON.stringify(['EVENT', event]));
        ws.onmessage = () => { clearTimeout(timer); ws.close(); resolve(); };
        ws.onclose = ws.onerror = () => { clearTimeout(timer); resolve(); };
      } catch (_) { resolve(); }
    })));
  }

  async function sha256hex(data) {
    // crypto.subtle.digest accepts any BufferSource (Uint8Array, ArrayBuffer, …)
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ── DOM refs
  const socialBtn      = $('social');
  const socialOverlay  = $('social-overlay');
  const socialCloseBtn = $('social-close');
  const npubDisplay    = $('social-npub-display');
  const generateBtn    = $('social-generate');
  const publishBtn     = $('social-publish');
  const syncNowBtn     = $('social-sync-now');
  const syncIntervalEl = $('social-sync-interval');
  const socialLogEl    = $('social-log');
  const followInput    = $('social-follow-input');
  const followBtnEl    = $('social-follow-btn');
  const searchInput    = $('social-search-input');
  const searchBtnEl    = $('social-search-btn');
  const searchResults  = $('social-search-results');
  const socialList     = $('social-list');

  function sLog(msg, cls = '') {
    const d = document.createElement('div');
    d.className = 'slog-line ' + (cls || 'hint');
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    socialLogEl.appendChild(d);
    socialLogEl.scrollTop = socialLogEl.scrollHeight;
  }

  function getFollowing() {
    try { return JSON.parse(localStorage.getItem(SOCIAL_FOLLOWING_KEY) || '[]'); } catch (_) { return []; }
  }
  function saveFollowing(list) { localStorage.setItem(SOCIAL_FOLLOWING_KEY, JSON.stringify(list)); }

  function truncNpub(n) {
    if (!n || n.length < 16) return n || '';
    return n.slice(0, 12) + '…' + n.slice(-6);
  }

  // Refresh identity display and enable/disable action buttons
  async function socialInit() {
    const nsec = localStorage.getItem(SOCIAL_NSEC_KEY);
    if (!nsec) {
      npubDisplay.innerHTML = '<span class="hint">no identity — generate one below</span>';
      publishBtn.disabled = true;
      syncNowBtn.disabled = true;
    } else {
      try {
        const res = await nostrCall('pubkey', nsec);
        const pubkey = typeof res === 'string' ? res : (res.pubkey || String(res));
        const enc = await nostrCall('encode_npub', pubkey);
        const npub = typeof enc === 'string' ? enc : JSON.stringify(enc);
        localStorage.setItem('traits.nostr.npub', npub);
        npubDisplay.innerHTML =
          `<span class="social-npub">${truncNpub(npub)}</span>` +
          ` <button id="social-copy-npub" title="Copy full npub to clipboard" style="padding:1px 8px; font-size:10px; margin:0 6px;">copy npub</button>` +
          ` <span class="hint" style="font-size:10px">${pubkey.slice(0, 16)}…</span>`;
        const copyBtn = $('social-copy-npub');
        if (copyBtn) {
          copyBtn.onclick = async () => {
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(npub);
              } else {
                const ta = document.createElement('textarea');
                ta.value = npub;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                ta.remove();
              }
              sLog('copied ' + truncNpub(npub) + ' to clipboard', 'ok');
            } catch (e) {
              sLog('copy failed: ' + (e && e.message ? e.message : e), 'err');
            }
          };
        }
        publishBtn.disabled = !emulator;
        syncNowBtn.disabled = false;
      } catch (e) {
        npubDisplay.innerHTML = `<span class="err">key error: ${e.message}</span>`;
      }
    }
    renderFollowList();
  }

  function renderFollowList() {
    const following = getFollowing();
    if (!following.length) {
      socialList.innerHTML =
        '<div class="hint" style="font-size:12px;padding:4px 0">no followed users yet — paste a npub above and click follow</div>';
      return;
    }
    socialList.innerHTML = following.map(npub =>
      `<div class="follow-card" data-npub="${npub}">
        <div class="fc-npub">${truncNpub(npub)}</div>
        <div class="fc-meta">${npub}</div>
        <div class="fc-actions">
          <button class="fc-sync-btn" data-npub="${npub}">sync</button>
          <button class="fc-view-btn" data-npub="${npub}">view files</button>
          <button class="fc-unfollow-btn" data-npub="${npub}" style="margin-left:auto;color:#f87171">unfollow</button>
        </div>
      </div>`
    ).join('');
  }

  async function doFollow(npub) {
    npub = npub.trim();
    if (!npub.startsWith('npub1') || npub.length < 30) {
      sLog('invalid npub — must start with npub1 and be at least 30 chars', 'err'); return;
    }
    const following = getFollowing();
    if (following.includes(npub)) { sLog('already following ' + truncNpub(npub)); return; }
    following.push(npub);
    saveFollowing(following);
    sLog('following ' + truncNpub(npub), 'ok');
    // Create directory in 9P share: /following/<npub>
    const fs = emulator && emulator.fs9p;
    if (fs) {
      try { fs.create_directory('/following'); } catch (_) {}
      try { fs.create_directory('/following/' + npub); sLog('created /mnt/host/following/' + truncNpub(npub), 'ok'); }
      catch (e) { sLog('note: 9P dir creation: ' + e.message, 'hint'); }
    }
    renderFollowList();
  }

  async function doSyncOne(npub) {
    npub = npub.trim();
    sLog('syncing ' + truncNpub(npub) + '…');
    let pubkeyHex;
    try {
      const res = await nostrCall('decode_npub', npub);
      pubkeyHex = typeof res === 'string' ? res : (res.pubkey || JSON.stringify(res));
    } catch (e) { sLog('decode_npub failed: ' + e.message, 'err'); return; }

    const events = await nostrReq(NOSTR_RELAYS, {
      kinds: [30000], authors: [pubkeyHex], '#d': ['public-folder'], limit: 5,
    });
    if (!events.length) { sLog('no manifest found for ' + truncNpub(npub), 'hint'); return; }

    const ev = events.sort((a, b) => (b.created_at || 0) - (a.created_at || 0))[0];
    let manifest;
    try { manifest = JSON.parse(ev.content); }
    catch (e) { sLog('invalid manifest: ' + e.message, 'err'); return; }
    if (!manifest.base || !Array.isArray(manifest.files)) {
      sLog('manifest missing base/files', 'err'); return;
    }
    sLog('manifest: ' + manifest.files.length + ' file(s) from ' + manifest.base);

    const fs = emulator && emulator.fs9p;
    let synced = 0;
    for (const f of manifest.files) {
      try {
        const url = manifest.base.replace(/\/+$/, '') + '/' + f.p.replace(/^\/+/, '');
        const resp = await fetch(url);
        if (!resp.ok) { sLog('fetch ' + f.p + ' → ' + resp.status, 'hint'); continue; }
        const buf = await resp.arrayBuffer();
        // Verify hash if provided
        if (f.h && f.h.startsWith('sha256:')) {
          const got = 'sha256:' + (await sha256hex(buf));
          if (got !== f.h) { sLog('hash mismatch: ' + f.p, 'err'); continue; }
        }
        // Write to 9P share under /following/<npub>/
        if (fs) {
          const dest = '/following/' + npub + '/' + f.p.replace(/^\/+/, '');
          // Create parent directories
          const parts = dest.split('/').filter(Boolean);
          let cur = '';
          for (let i = 0; i < parts.length - 1; i++) {
            cur += '/' + parts[i];
            try { fs.create_directory(cur); } catch (_) {}
          }
          await fs.write_file(dest, new Uint8Array(buf));
        }
        synced++;
      } catch (e) { sLog('error on ' + f.p + ': ' + e.message, 'err'); }
    }
    sLog(`synced ${synced}/${manifest.files.length} for ${truncNpub(npub)}`, synced > 0 ? 'ok' : 'hint');
  }

  async function doSyncAll() {
    const following = getFollowing();
    if (!following.length) { sLog('no followed users to sync'); return; }
    sLog('syncing ' + following.length + ' user(s)…');
    for (const npub of following) await doSyncOne(npub);
    sLog('sync complete', 'ok');
  }

  async function doPublish() {
    const nsec = localStorage.getItem(SOCIAL_NSEC_KEY);
    if (!nsec) { sLog('no identity — generate one first', 'err'); return; }
    const fs = emulator && emulator.fs9p;
    if (!fs) { sLog('9P share not available — boot v86 first', 'err'); return; }

    // Read tunnel base URL from /mnt/host/.social.tunnel (guest writes this)
    let baseUrl;
    try {
      const data = await fs.read_file('/.social.tunnel');
      baseUrl = new TextDecoder().decode(data).trim();
    } catch (_) {
      sLog('no /mnt/host/.social.tunnel — run social tunnel-up in the guest first', 'err');
      sLog('  wget -qO- https://www.traits.build/local/social.sh | sh', 'hint');
      sLog('  social tunnel-up 8080', 'hint');
      return;
    }

    // Walk /mnt/host/public via fs9p, compute sha256 of each file
    sLog('reading /mnt/host/public…');
    const files = [];
    async function walkPublic(dir) {
      for (const e of listDir(dir)) {
        if (e.dir) { await walkPublic(e.path); }
        else {
          try {
            const data = await fs.read_file(e.path);
            if (!data) continue;
            const h = 'sha256:' + (await sha256hex(data));
            const relPath = e.path.replace(/^\/public\/?/, '');
            files.push({ p: relPath, h, s: data.byteLength || data.length });
          } catch (e2) { sLog('skip ' + e.path + ': ' + e2.message, 'hint'); }
        }
      }
    }
    await walkPublic('/public');

    if (!files.length) { sLog('no files in /mnt/host/public', 'hint'); return; }
    sLog('found ' + files.length + ' file(s) — signing manifest…');

    const content  = JSON.stringify({ v: 1, base: baseUrl, files });
    const tagsJson = JSON.stringify([['d', 'public-folder'], ['r', baseUrl]]);
    const now      = String(Math.floor(Date.now() / 1000));

    let event;
    try {
      const res = await nostrCall('sign_event', nsec, '30000', content, tagsJson, now);
      event = typeof res === 'string' ? JSON.parse(res) : res;
    } catch (e) { sLog('sign_event failed: ' + e.message, 'err'); return; }

    sLog('broadcasting to ' + NOSTR_RELAYS.length + ' relays…');
    await nostrPublish(NOSTR_RELAYS, event);
    sLog('published! id: ' + (event.id || '').slice(0, 16) + '…', 'ok');
  }

  async function doSearch(query) {
    query = query.trim();
    if (!query) return;
    sLog('searching "' + query + '"…');
    searchResults.innerHTML = '<span class="hint">searching…</span>';
    const events = await nostrReq(NOSTR_RELAYS, {
      kinds: [30000], '#d': ['public-folder'], search: query, limit: 10,
    }, 9000);
    if (!events.length) {
      searchResults.innerHTML = '<span class="hint">no results</span>';
      sLog('no results for "' + query + '"', 'hint');
      return;
    }
    sLog('found ' + events.length + ' result(s)', 'ok');
    searchResults.innerHTML = events.map(ev => {
      let base = '';
      try { base = JSON.parse(ev.content).base || ''; } catch (_) {}
      return `<div class="row-flex" style="margin-top:4px">
        <span class="hint" style="word-break:break-all;flex:1">${ev.pubkey.slice(0, 16)}… ${base ? '→ ' + base.slice(0, 48) : ''}</span>
        <button class="search-follow-btn" data-pubkey="${ev.pubkey}">follow</button>
      </div>`;
    }).join('');
  }

  // ── Event handlers
  generateBtn.onclick = async () => {
    if (!confirm('Generate a new Nostr identity? Existing key in localStorage will be overwritten.')) return;
    sLog('generating keypair…');
    try {
      const res = await nostrCall('keygen');
      const d = typeof res === 'string' ? JSON.parse(res) : res;
      const nsec = d.nsec || d.secret_key || d[0] || '';
      if (!nsec) throw new Error('keygen returned no nsec: ' + JSON.stringify(d));
      localStorage.setItem(SOCIAL_NSEC_KEY, nsec);
      sLog('identity generated!', 'ok');
      await socialInit();
    } catch (e) { sLog('keygen failed: ' + e.message, 'err'); }
  };

  publishBtn.onclick  = doPublish;
  syncNowBtn.onclick  = doSyncAll;

  syncIntervalEl.onchange = () => {
    clearInterval(socialSyncTimer);
    const ms = parseInt(syncIntervalEl.value);
    if (ms > 0) {
      socialSyncTimer = setInterval(doSyncAll, ms);
      sLog('auto-sync every ' + (ms / 60000) + ' min', 'ok');
    } else { sLog('auto-sync disabled'); }
  };

  followBtnEl.onclick = () => { doFollow(followInput.value); followInput.value = ''; };
  followInput.onkeydown = e => { if (e.key === 'Enter') followBtnEl.onclick(); };
  searchBtnEl.onclick = () => doSearch(searchInput.value);
  searchInput.onkeydown = e => { if (e.key === 'Enter') searchBtnEl.onclick(); };

  socialList.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const npub = btn.dataset.npub;
    if (btn.classList.contains('fc-sync-btn'))     doSyncOne(npub);
    if (btn.classList.contains('fc-view-btn')) {
      // Open viewer overlay on /following/<npub>
      if (pathEl) pathEl.value = '/following/' + npub;
      overlay.hidden = false; renderTree(); vSet('ready');
    }
    if (btn.classList.contains('fc-unfollow-btn')) {
      if (!confirm('Unfollow ' + truncNpub(npub) + '?')) return;
      saveFollowing(getFollowing().filter(n => n !== npub));
      sLog('unfollowed ' + truncNpub(npub));
      renderFollowList();
    }
  });

  searchResults.addEventListener('click', e => {
    const btn = e.target.closest('.search-follow-btn'); if (!btn) return;
    nostrCall('encode_npub', btn.dataset.pubkey).then(res => {
      doFollow(typeof res === 'string' ? res : JSON.stringify(res));
    }).catch(err => sLog('encode_npub: ' + err.message, 'err'));
  });

  socialBtn.onclick = () => {
    if (!emulator) { setStatus('boot v86 first', 'err'); return; }
    socialOverlay.hidden = false;
    socialInit();
  };
  socialCloseBtn.onclick = () => { socialOverlay.hidden = true; term.focus(); };

  // Keep social button in sync with emulator state
  setInterval(() => { socialBtn.disabled = !emulator; }, 800);

  // ?autoboot=1 [&restore=1]
  const qs = new URLSearchParams(location.search);
  if (qs.get('autoboot') === '1') boot({ restore: qs.get('restore') === '1' });
})();
</script>
</body>
</html>
