<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron IDE - traits.build</title>
  <link rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
  <link rel="stylesheet" href="./styles-vscode.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      min-height: 100vh;
    }
    #layout {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.88);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    body.resizing {
      cursor: row-resize;
      user-select: none;
    }
    #ide-panel {
      position: relative;
      flex: 0 0 62%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-bottom: 1px solid #2d3d5f;
      background: #0f141b;
    }
    #ide-panel > vscode-workbench {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 0;
      position: relative !important;
      inset: auto !important;
      flex: none !important;
    }
    #shell-panel {
      flex: 1;
      min-width: 0;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }
    #resize-handle {
      flex: 0 0 10px;
      height: 10px;
      cursor: row-resize;
      background: linear-gradient(180deg, #223352 0%, #2d3d5f 50%, #223352 100%);
      border-top: 1px solid #31466f;
      border-bottom: 1px solid #1a273f;
      touch-action: none;
    }
    #shell-panel iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="boot" id="status">Booting Apptron IDE...</div>
  <div id="layout">
    <div id="ide-panel">
      <vscode-workbench></vscode-workbench>
    </div>
    <div id="resize-handle" aria-label="Resize panels" role="separator"></div>
    <div id="shell-panel">
      <iframe src="/static/apptron/index.html" allow="clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
  </div>

  <script>
    window.APPTRON_BASE = '/static/apptron-ide';
    const __apptronIdeParams = new URLSearchParams(window.location.search);
    window.APPTRON_DISABLE_SYSTEM_EXTENSION = __apptronIdeParams.get('system_ext') === 'off';
    window.apptron = { instance: null, ready: null };
  </script>

  <script type="module">
    import './lib/vscode.js';

    const status = document.getElementById('status');
    const workbench = document.querySelector('vscode-workbench');
    const layout = document.getElementById('layout');
    const idePanel = document.getElementById('ide-panel');
    const resizeHandle = document.getElementById('resize-handle');
    const params = new URLSearchParams(window.location.search);
    const SPLIT_KEY = 'apptron.ide.split.height';

    function setupHorizontalResize() {
      if (!layout || !idePanel || !resizeHandle) return;

      try {
        const saved = parseInt(localStorage.getItem(SPLIT_KEY) || '', 10);
        if (!Number.isNaN(saved) && saved > 120) {
          idePanel.style.flex = `0 0 ${saved}px`;
        }
      } catch {
      }

      let dragging = false;
      let startY = 0;
      let startHeight = 0;

      const onMove = (event) => {
        if (!dragging) return;
        const deltaY = event.clientY - startY;
        const handleHeight = resizeHandle.offsetHeight || 10;
        const minHeight = 140;
        const maxHeight = Math.max(minHeight, layout.clientHeight - minHeight - handleHeight);
        const next = Math.max(minHeight, Math.min(maxHeight, startHeight + deltaY));
        idePanel.style.flex = `0 0 ${next}px`;
      };

      const stopDrag = () => {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove('resizing');
        try {
          localStorage.setItem(SPLIT_KEY, String(Math.round(idePanel.getBoundingClientRect().height)));
        } catch {
        }
      };

      resizeHandle.addEventListener('pointerdown', (event) => {
        dragging = true;
        startY = event.clientY;
        startHeight = idePanel.getBoundingClientRect().height;
        document.body.classList.add('resizing');
        try {
          resizeHandle.setPointerCapture(event.pointerId);
        } catch {
        }
      });

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);
    }

    setupHorizontalResize();

    function shellCacheBustValue() {
      const explicit = params.get('cb');
      return explicit || String(Date.now());
    }

    function hiddenShellUrl() {
      const shellParams = new URLSearchParams();
      shellParams.set('embedded', 'true');
      shellParams.set('mode', 'console');
      shellParams.set('ide_bridge', '1');
      for (const key of ['network', 'relay', 'relay_url', 'worker_url', 'origin', 'debug9p', 'wasm', 'bundle', 'cb', 'term_path', 'ide_xterm']) {
        const value = params.get(key);
        if (value) {
          shellParams.set(key, value);
        }
      }
      if (!shellParams.get('cb')) {
        shellParams.set('cb', shellCacheBustValue());
      }
      return `/static/apptron/index.html?${shellParams.toString()}`;
    }

    async function waitRuntimeReadyBounded(runtime, maxWaitMs = 8000) {
      if (!runtime || typeof runtime.ready !== 'function') return;
      let timeoutId;
      const timeoutPromise = new Promise((resolve) => {
        timeoutId = setTimeout(resolve, maxWaitMs);
      });
      try {
        await Promise.race([runtime.ready(), timeoutPromise]);
      } catch {
        // Continue with runtime handoff even if ready() rejects.
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function createWanixPortWithRetry(runtime, onProgress, maxWaitMs = 0) {
      const started = Date.now();
      let lastProgressSec = -1;
      while (true) {
        try {
          const wanixPort = await runtime.createPort();
          if (wanixPort) {
            return wanixPort;
          }
        } catch {
          // Retry while hidden shell runtime finishes initialization.
        }
        const elapsedMs = Date.now() - started;
        const elapsedSec = Math.floor(elapsedMs / 1000);
        if (elapsedSec !== lastProgressSec && elapsedSec % 5 === 0) {
          lastProgressSec = elapsedSec;
          if (typeof onProgress === 'function') {
            onProgress(elapsedSec);
          }
        }
        if (maxWaitMs > 0 && elapsedMs > maxWaitMs) {
          throw new Error(`Timed out waiting for hidden-shell wanix port after ${Math.floor(maxWaitMs / 1000)}s`);
        }
        await new Promise((resolve) => setTimeout(resolve, 200));
      }
    }

    async function bootRuntime() {
      const iframe = document.createElement('iframe');
      iframe.src = hiddenShellUrl();
      iframe.style.position = 'fixed';
      iframe.style.left = '-10000px';
      iframe.style.top = '0';
      iframe.style.width = '1px';
      iframe.style.height = '1px';
      iframe.style.opacity = '0';
      iframe.style.pointerEvents = 'none';
      iframe.style.border = '0';
      iframe.setAttribute('aria-hidden', 'true');
      document.body.appendChild(iframe);

      const started = Date.now();
      const timeoutMs = 30000;

      return new Promise((resolve, reject) => {
        const probe = async () => {
          try {
            const runtime = iframe.contentWindow?.apptron?.instance;
            if (runtime) {
              await waitRuntimeReadyBounded(runtime);
              window.apptron.instance = runtime;
              resolve(runtime);
              return;
            }
          } catch {
            // Keep polling until timeout while shell frame boots.
          }

          if (Date.now() - started > timeoutMs) {
            reject(new Error('Apptron shell runtime did not initialize in time'));
            return;
          }

          setTimeout(probe, 150);
        };

        iframe.addEventListener('load', () => {
          void probe();
        });
        void probe();
      });
    }

    async function setupVSCodeSettings(runtime) {
      if (!runtime) return;
      // NOTE: Markdown preview requires VS Code Web's sandboxed subdomains (e.g., UUID.traits.build).
      // These subdomains must resolve via DNS (either wildcard *.traits.build or relay proxy).
      // Without DNS resolution, markdown preview will show "server IP not found" error.
      // 
      // Do NOT set 'markdown.experimental.useSandbox': false as it breaks rendering entirely.
      //
      // Temporary limitation: markdown preview unavailable in sandboxed browser IDE until:
      // - DNS wildcard configured for *.traits.build, OR
      // - Relay worker proxies markdown preview subdomains, OR
      // - Different VS Code variant used (e.g., native app vs web)
      const vscodeSettingsPath = 'vm/1/fsys/home/root/.config/Code/User/settings.json';
      const settingsDir = 'vm/1/fsys/home/root/.config/Code/User';
      try {
        // Create directory structure if needed
        await withTimeout(runtime.makeDir('vm/1/fsys/home/root'), 1000).catch(() => {});
        await withTimeout(runtime.makeDir('vm/1/fsys/home/root/.config'), 1000).catch(() => {});
        await withTimeout(runtime.makeDir('vm/1/fsys/home/root/.config/Code'), 1000).catch(() => {});
        await withTimeout(runtime.makeDir(settingsDir), 1000).catch(() => {});
        
        // Read existing settings if they exist
        let settings = {};
        try {
          const existing = await withTimeout(runtime.readFile(vscodeSettingsPath), 1000);
          if (existing && typeof existing === 'string') {
            try { settings = JSON.parse(existing); } catch { }
          }
        } catch { }
        
        // Configure safe VS Code defaults (but do NOT disable sandbox)
        const newSettings = {
          ...settings,
          'workbench.colorTheme': 'Default Dark Modern',
          'editor.wordWrap': 'on',
          'markdown.preview.fontSize': 14,
        };
        
        await withTimeout(
          runtime.writeFile(vscodeSettingsPath, JSON.stringify(newSettings, null, 2)),
          1000
        );
        console.log('[IDE] VS Code settings configured');
      } catch (error) {
        console.warn('[IDE] Failed to set up VS Code settings:', error);
      }
    }

    window.apptron.ready = bootRuntime()
      .then((runtime) => {
        status.textContent = 'Runtime ready, configuring editor...';
        return runtime && setupVSCodeSettings(runtime).then(() => runtime);
      })
      .catch((error) => {
        console.error('Wanix boot failed:', error);
        status.textContent = 'Runtime failed, starting editor anyway...';
        return null;
      });

    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || !data.port) return;

      const receiverPort = data.port;
      const runtime = await window.apptron.ready;
      if (!runtime) {
        return;
      }

      try {
        status.textContent = 'Loading WASM kernel...';
        const wanixPort = await createWanixPortWithRetry(runtime, (elapsedSec) => {
          status.textContent = `Loading WASM kernel... ${elapsedSec}s`;
        });
        receiverPort.postMessage({ wanix: wanixPort }, [wanixPort]);
      } catch (error) {
        console.error('Failed to hand off wanix port:', error);
        status.textContent = 'WASM kernel failed to initialize. Reload to retry.';
      }
    });

    // --- Clipboard fallback for terminal paste ---
    // VS Code terminal calls navigator.clipboard.readText() which needs
    // explicit browser permission. The editor works because it uses native
    // paste events. Capture paste-event text as fallback for the API.
    {
      let lastPasteText = '';
      document.addEventListener('paste', (e) => {
        if (e.clipboardData) lastPasteText = e.clipboardData.getData('text/plain');
      }, true);
      const orig = navigator.clipboard.readText.bind(navigator.clipboard);
      navigator.clipboard.readText = async () => {
        try { return await orig(); }
        catch { return lastPasteText; }
      };
    }

    workbench.addEventListener('vscode-ready', () => {
      status.textContent = 'Apptron IDE ready';
      status.classList.add('ready');
    }, { once: true });

    workbench.mount();

    // --- Apptron Publishing (Service Worker + VFS auto-sync) ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('/publish-sw.js', { scope: '/' })
        .then(() => console.log('[publish] SW registered'))
        .catch((err) => console.warn('[publish] SW registration failed:', err));
    }

    const MIME = {
      html: 'text/html;charset=utf-8', htm: 'text/html;charset=utf-8',
      css: 'text/css;charset=utf-8', js: 'application/javascript;charset=utf-8',
      mjs: 'application/javascript;charset=utf-8',
      json: 'application/json;charset=utf-8', txt: 'text/plain;charset=utf-8',
      md: 'text/plain;charset=utf-8', xml: 'application/xml',
      svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg',
      jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
      ico: 'image/x-icon', woff: 'font/woff', woff2: 'font/woff2',
      pdf: 'application/pdf', wasm: 'application/wasm',
    };
    function guessMime(name) {
      return MIME[(name.split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
    }
    function withTimeout(p, ms) {
      return Promise.race([p, new Promise((_, r) => setTimeout(() => r('timeout'), ms))]);
    }

    // Recursively collect files from /public (depth-limited).
    async function collectPublic(runtime, prefix, depth) {
      if (depth > 3) return [];
      const base = 'vm/1/fsys/public' + (prefix ? '/' + prefix : '');
      let entries;
      try { entries = await withTimeout(runtime.readDir(base), 2000); }
      catch { return []; }
      if (!Array.isArray(entries)) return [];

      const files = [];
      for (const name of entries) {
        const rel = prefix ? prefix + '/' + name : name;
        try {
          const body = await withTimeout(runtime.readFile(base + '/' + name), 2000);
          if (body != null) files.push({ rel, body });
        } catch {
          // Probably a directory — recurse.
          const sub = await collectPublic(runtime, rel, depth + 1);
          files.push(...sub);
        }
      }
      return files;
    }

    let _syncing = false;
    let _published = new Set();
    async function syncPublish() {
      const runtime = window.apptron.instance;
      const sw = navigator.serviceWorker?.controller;
      if (!runtime || !sw || _syncing) return;
      _syncing = true;
      try {
        const files = await collectPublic(runtime, '', 0);
        const current = new Set(files.map((f) => f.rel));

        for (const { rel, body } of files) {
          sw.postMessage({
            type: 'publish-file', path: '/' + rel,
            body, contentType: guessMime(rel),
          });
          _published.add(rel);
        }
        // Remove files that were published before but no longer exist.
        for (const rel of _published) {
          if (!current.has(rel)) {
            sw.postMessage({ type: 'unpublish-file', path: '/' + rel });
            _published.delete(rel);
          }
        }
        if (files.length) {
          console.log(`[publish] Synced ${files.length} file(s) → ${location.origin}/`);
        }
      } catch { /* ignore */ }
      finally { _syncing = false; }
    }

    // Ensure /public exists in the guest FS (IDE boots without with_env=1, so
    // project-fs never creates it). Files written here are memfs-only for this
    // session but still get published through the SW cache.
    async function ensurePublicDir(rt) {
      try { await withTimeout(rt.makeDir('vm/1/fsys/public'), 2000); }
      catch { /* already exists or not yet ready — sync loop will retry via readDir */ }
    }

    // Start periodic sync once both runtime and SW are active.
    window.apptron.ready.then(async (rt) => {
      if (!rt || !('serviceWorker' in navigator)) return;
      await ensurePublicDir(rt);
      navigator.serviceWorker.ready.then(() => {
        syncPublish();
        setInterval(syncPublish, 5000);
      });
    });
  </script>
</body>
</html>
