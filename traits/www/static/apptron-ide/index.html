<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron IDE - traits.build</title>
  <link rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
  <link rel="stylesheet" href="./styles-vscode.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.88);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    vscode-workbench {
      flex: 1;
      min-height: 0;
      display: flex;
    }
  </style>
</head>
<body>
  <div class="boot" id="status">Booting Apptron IDE...</div>
  <vscode-workbench></vscode-workbench>

  <script>
    window.APPTRON_BASE = '/static/apptron-ide';
  </script>

  <script type="module">
    import { WanixRuntime } from './wanix.min.js';
    import './lib/vscode.js';

    const status = document.getElementById('status');
    const qp = new URLSearchParams(window.location.search);
    const defaultOrigin =
      window.location.hostname === '127.0.0.1' ||
      window.location.hostname === 'localhost' ||
      window.location.hostname === '::1'
        ? 'https://apptron.dev'
        : window.location.origin;
    const defaultNetwork = (() => {
      try {
        const origin = new URL(defaultOrigin);
        const wsProto = origin.protocol === 'https:' ? 'wss:' : 'ws:';
        return `${wsProto}//${origin.host}/x/net`;
      } catch {
        return '';
      }
    })();

    window.apptron = {
      mode: 'edit',
      origin: qp.get('origin') || defaultOrigin,
      embedded: true,
      env: {
        name: 'traits-apptron-ide',
        uuid: 'traits-apptron-ide',
        owner: 'traits',
        ownername: 'traits',
        visibility: 'public',
      },
      user: { username: 'traits', user_id: 'traits-local' },
      publishURL: async () => window.location.origin,
    };

    const runtime = new WanixRuntime({
      screen: true,
      helpers: true,
      debug9p: qp.get('debug9p') === 'true',
      wasm: qp.get('wasm') || './wanix.wasm',
      bundle: qp.get('bundle') || '../apptron/bundles/sys.tar.gz',
      network: qp.get('network') || defaultNetwork,
    });

    const screen = document.createElement('canvas');
    screen.id = 'apptron-screen';
    screen.style.display = 'none';
    document.body.appendChild(screen);
    if (screen.transferControlToOffscreen) {
      runtime.screen = screen.transferControlToOffscreen();
    }

    window.apptron.instance = runtime;

    const workbench = document.querySelector('vscode-workbench');
    workbench.mount();
    workbench.addEventListener('vscode-ready', () => {
      status.textContent = 'Apptron IDE ready';
      status.classList.add('ready');
    }, { once: true });

    const topChannel = new MessageChannel();
    topChannel.port2.onmessage = async (event) => {
      await runtime.ready();
      const wanixPort = runtime.createPort();
      const p9Channel = new MessageChannel();
      p9Channel.port1.onmessage = (message) => {
        runtime._virtioHandle(message.data, (buf) => {
          p9Channel.port1.postMessage(buf);
        });
      };
      event.data.port.postMessage({ wanix: wanixPort, p9: p9Channel.port2 }, [wanixPort, p9Channel.port2]);
    };
    top.postMessage({ factory: topChannel.port1 }, '*', [topChannel.port1]);

    window.addEventListener('message', async (event) => {
      if (!event?.data?.port) return;
      try {
        await runtime.ready();
        status.textContent = 'Launching VS Code workbench...';
        const wanixPort = runtime.createPort();
        event.data.port.postMessage({ wanix: wanixPort }, [wanixPort]);
      } catch (error) {
        console.error('Apptron IDE port bootstrap failed', error);
        status.textContent = `Apptron IDE boot failed: ${error?.message || error}`;
      }
    });
  </script>
</body>
</html>
