<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron IDE - traits.build</title>
  <link rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
  <link rel="stylesheet" href="./styles-vscode.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.88);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    vscode-workbench {
      flex: 1;
      min-height: 0;
      display: flex;
    }
  </style>
</head>
<body>
  <div class="boot" id="status">Booting Apptron IDE...</div>
  <vscode-workbench></vscode-workbench>

  <script>
    window.APPTRON_BASE = '/static/apptron-ide';
    window.APPTRON_DISABLE_SYSTEM_EXTENSION = false;
    window.apptron = { instance: null, ready: null };
  </script>

  <script type="module">
    import './lib/vscode.js';

    const status = document.getElementById('status');
    const workbench = document.querySelector('vscode-workbench');

    async function bootRuntime() {
      const iframe = document.createElement('iframe');
      iframe.src = '/static/apptron/index.html?embedded=true&mode=console&ide_bridge=1';
      iframe.style.display = 'none';
      iframe.setAttribute('aria-hidden', 'true');
      document.body.appendChild(iframe);

      const started = Date.now();
      const timeoutMs = 30000;

      return new Promise((resolve, reject) => {
        const probe = async () => {
          try {
            const runtime = iframe.contentWindow?.apptron?.instance;
            if (runtime) {
              if (typeof runtime.ready === 'function') {
                await runtime.ready();
              }
              window.apptron.instance = runtime;
              resolve(runtime);
              return;
            }
          } catch {
            // Keep polling until timeout while shell frame boots.
          }

          if (Date.now() - started > timeoutMs) {
            reject(new Error('Apptron shell runtime did not initialize in time'));
            return;
          }

          setTimeout(probe, 150);
        };

        iframe.addEventListener('load', () => {
          void probe();
        });
        void probe();
      });
    }

    window.apptron.ready = bootRuntime()
      .then((runtime) => {
        status.textContent = 'Runtime ready, starting workbench...';
        return runtime;
      })
      .catch((error) => {
        console.error('Wanix boot failed:', error);
        status.textContent = 'Runtime failed, starting editor anyway...';
        return null;
      });

    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || !data.port) return;

      const receiverPort = data.port;
      const runtime = await window.apptron.ready;
      if (!runtime) {
        return;
      }

      try {
        const wanixPort = await runtime.createPort();
        receiverPort.postMessage({ wanix: wanixPort }, [wanixPort]);
      } catch (error) {
        console.error('Failed to hand off wanix port:', error);
      }
    });

    workbench.addEventListener('vscode-ready', () => {
      status.textContent = 'Apptron IDE ready';
      status.classList.add('ready');
    }, { once: true });

    workbench.mount();
  </script>
</body>
</html>
