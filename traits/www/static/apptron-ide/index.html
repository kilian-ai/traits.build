<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron IDE - traits.build</title>
  <link rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
  <link rel="stylesheet" href="./styles-vscode.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.88);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    vscode-workbench {
      flex: 1;
      min-height: 0;
      display: flex;
    }
  </style>
</head>
<body>
  <div class="boot" id="status">Booting Apptron IDE...</div>
  <vscode-workbench></vscode-workbench>

  <script>
    window.APPTRON_BASE = '/static/apptron-ide';
  </script>

  <script type="module">
    import { WanixRuntime } from './wanix.min.js';
    import './lib/vscode.js';

    const status = document.getElementById('status');
    const qp = new URLSearchParams(window.location.search);

    window.apptron = {
      mode: 'edit',
      origin: window.location.origin,
      embedded: true,
      env: {
        name: 'traits-apptron-ide',
        uuid: 'traits-apptron-ide',
        owner: 'traits',
        ownername: 'traits',
        visibility: 'public',
      },
      user: Promise.resolve({ username: 'traits', user_id: 'traits-local' }),
      publishURL: async () => window.location.origin,
    };

    const runtime = new WanixRuntime({
      screen: true,
      helpers: true,
      debug9p: qp.get('debug9p') === 'true',
      wasm: qp.get('wasm') || './wanix.wasm',
      bundle: qp.get('bundle') || '../apptron/bundles/sys.tar.gz',
      network: qp.get('network') || '',
    });

    window.apptron.instance = runtime;

    window.addEventListener('message', async (event) => {
      if (!event?.data?.port) return;
      try {
        await runtime.ready();
        const port = runtime.createPort();
        event.data.port.postMessage({ wanix: port }, [port]);
        status.textContent = 'Apptron IDE ready';
        status.classList.add('ready');
      } catch (error) {
        console.error('Apptron IDE port bootstrap failed', error);
      }
    });

    try {
      await runtime.ready();
      const workbench = document.querySelector('vscode-workbench');
      workbench.mount();
      status.textContent = 'Launching VS Code workbench...';
      workbench.addEventListener('vscode-ready', () => {
        status.textContent = 'Apptron IDE ready';
        status.classList.add('ready');
      }, { once: true });
    } catch (error) {
      console.error('Apptron IDE bootstrap failed', error);
      status.textContent = `Apptron IDE boot failed: ${error?.message || error}`;
    }
  </script>
</body>
</html>
