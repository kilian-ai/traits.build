<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apptron Barebones (local)</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101418; color: #d7e2f7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #status { position: fixed; top: 8px; right: 8px; z-index: 10; font-size: 11px; background: rgba(20,29,46,.9); border: 1px solid #2d3d5f; border-radius: 6px; padding: 4px 8px; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #log { position: fixed; top: 40px; right: 8px; z-index: 10; font-size: 10px; background: rgba(20,29,46,.9); border: 1px solid #2d3d5f; border-radius: 6px; padding: 4px 8px; max-width: 45%; max-height: 60vh; overflow: auto; white-space: pre; }
    .xterm { width: 100%; height: 100%; }
    .xterm-screen, .xterm-viewport { width: 100% !important; height: 100% !important; }
    .xterm-viewport { background: rgb(33,39,50) !important; }
  </style>
</head>
<body>
  <div id="status">Booting…</div>
  <div id="log"></div>
  <div id="loader" style="display:none"><p class="loader-status"></p></div>
<script>
// PIC shim: v86 npm v0.5.333 WASM lacks 14 PIC function exports that the Wanix
// blob worker expects. We intercept blob worker creation and prepend JS code that
// wraps WebAssembly.instantiate to add PIC shim functions via Proxy on exports.
(function() {
  const SHIM = `(function(){
var _wI=WebAssembly.instantiate,_wIS=WebAssembly.instantiateStreaming;
function shimIt(inst,imp){
  var ex=inst.exports;
  if(!ex||!ex.get_pic_addr_master||ex.pic_set_irq)return inst;
  var mem=(imp&&imp.env&&imp.env.memory)||ex.memory;
  if(!mem)return inst;
  function p(s){return new Uint8Array(mem.buffer,s?ex.get_pic_addr_slave():ex.get_pic_addr_master(),13)}
  function hasPend(s){var q=p(s);return(q[3]&~q[0]&255)!==0}
  function chkSlv(){if(hasPend(1))shm.pic_set_irq(2);else shm.pic_clear_irq(2)}
  function wCmd(q,v){
    if(v&16){q[3]=0;q[2]=0;q[0]=0;q[11]=0;q[9]=0;q[6]=(v&1)?1:0;q[7]=1;q[8]=0}
    else if(v&8){if(v&2)q[8]=(v&1)?1:0;if(v&64)q[12]=(v&32)?1:0}
    else{var c=v>>5;if(c===1){var s=q[2];if(s){var b=0;while(b<8&&!(s&(1<<b)))b++;if(b<8)q[2]&=~(1<<b)&255}}
    else if(c===3)q[2]&=~(1<<(v&7))&255}
  }
  function wDat(q,v){
    var st=q[7];
    if(st===0)q[0]=v;
    else if(st===1){q[1]=v;q[7]=2}
    else if(st===2)q[7]=q[6]?3:0;
    else if(st===3){q[9]=(v&2)?1:0;q[7]=0}
  }
  var shm={
    pic_set_irq:function(i){var s=i>=8,b=i&7,m=1<<b,q=p(s);if(!(q[11]&m)||(q[10]&m)){q[3]|=m;q[11]|=m}if(s)chkSlv()},
    pic_clear_irq:function(i){var s=i>=8,b=i&7,m=1<<b,q=p(s);q[11]&=~m&255;if(q[10]&m)q[3]&=~m&255;if(s)chkSlv()},
    port20_read:function(){var q=p(0);return q[8]?q[2]:q[3]},
    port21_read:function(){return p(0)[0]},
    portA0_read:function(){var q=p(1);return q[8]?q[2]:q[3]},
    portA1_read:function(){return p(1)[0]},
    port4D0_read:function(){return p(0)[10]},
    port4D1_read:function(){return p(1)[10]},
    port20_write:function(v){wCmd(p(0),v)},
    port21_write:function(v){wDat(p(0),v)},
    portA0_write:function(v){wCmd(p(1),v)},
    portA1_write:function(v){wDat(p(1),v)},
    port4D0_write:function(v){p(0)[10]=v},
    port4D1_write:function(v){p(1)[10]=v}
  };
  var px=new Proxy(ex,{get:function(t,k){return shm[k]||t[k]}});
  return{exports:px};
}
WebAssembly.instantiate=function(s,imp){return _wI.call(WebAssembly,s,imp).then(function(r){
  if(r&&r.instance)return{module:r.module,instance:shimIt(r.instance,imp)};
  return shimIt(r,imp);
})};
if(_wIS)WebAssembly.instantiateStreaming=function(s,imp){return _wIS.call(WebAssembly,s,imp).then(function(r){
  if(r&&r.instance)return{module:r.module,instance:shimIt(r.instance,imp)};
  return shimIt(r,imp);
})};
})();\n`;
  var _origCOU = URL.createObjectURL.bind(URL);
  URL.createObjectURL = function(blob) {
    if (blob instanceof Blob && blob.size > 100000) {
      var bt = (blob.type || "").toLowerCase();
      if (bt.indexOf("javascript") >= 0 || (bt === "" && blob.size < 1500000)) {
        blob = new Blob([SHIM, blob], { type: blob.type || "application/javascript" });
      }
    }
    return _origCOU(blob);
  };
})();
</script>
  <script type="module">
    const s = (t) => { document.getElementById('status').textContent = t; console.log('[bb]', t); };
    const l = (t) => { document.getElementById('log').textContent += t + '\n'; console.log('[bb]', t); };
    window.apptron = { origin: location.origin, mode: 'console', embedded: false, user: { username: 'root', user_id: 'local' }, publishURL: async () => location.origin };
    try {
      s('import wanix.min.js');
      const { WanixRuntime } = await import('./wanix.min.js');
      l('WanixRuntime imported');
      const w = new WanixRuntime({ screen: true, helpers: true, debug9p: false, wasm: null, network: 'wss://relay.traits.build/linux/tunnel' });
      const canvas = document.createElement('canvas'); canvas.id = 'screen'; canvas.style.display = 'none'; document.body.appendChild(canvas);
      w.screen = canvas.transferControlToOffscreen();
      w._bundle = fetch('./bundles/sys.tar.gz').then(r => { if(!r.ok) throw new Error('bundle '+r.status); return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); });
      w._getBundle = async (name) => { const u = './' + name.replace(/^\//,''); const r = await fetch(u); if (!r.ok) throw new Error('bundle '+name+' '+r.status); return name.endsWith('.gz') ? new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() : r.arrayBuffer(); };
      s('fetch wasm');
      const wasm = await fetch('./wanix.wasm').then(r => r.arrayBuffer());
      l('wasm ' + wasm.byteLength + ' bytes');
      w._loadWasm(wasm); l('_loadWasm called');
      s('ready()'); await w.ready(); l('ready'); window.apptron.instance = w;
      try {
        l('task: ' + JSON.stringify(await w.readDir('task')));
        l('task/1/type: ' + JSON.stringify(await w.readText('task/1/type')));
        l('task/1/cmd: ' + JSON.stringify(await w.readText('task/1/cmd')));
      } catch (e) { l('inspect err: ' + e.message); }
      s('allocate xterm');
      const xid = (await w.readText('web/dom/new/xterm')).trim();
      l('xid=' + xid);
      await w.writeFile('task/1/ctl', `bind #console/data web/dom/${xid}/data`); l('bind done');
      await w.writeFile('web/dom/body/ctl', `append-child ${xid}`); l('append done');
      try { await w.writeFile(`web/dom/${xid}/data`, '\n'); l('kick'); } catch (e) { l('kick err: ' + e.message); }
      s('Ready');
      setTimeout(async () => {
        try {
          l('AFTER 3s t1.type=' + JSON.stringify(await w.readText('task/1/type')) + ' cmd=' + JSON.stringify(await w.readText('task/1/cmd')));
          for (const x of document.querySelectorAll('.xterm')) l('xterm len=' + x.innerText.length + ' sample=' + JSON.stringify(x.innerText.slice(0,100)));
        } catch (e) { l('post err: ' + e.message); }
      }, 3000);
    } catch (e) { s('ERROR: ' + e.message); l('FATAL: ' + (e.stack || e.message)); }
  </script>
</body>
</html>
