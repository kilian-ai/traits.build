<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron Local Shell</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101418;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      position: relative;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.85);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .xterm {
      width: 100%;
      height: 100%;
    }
    .xterm-screen,
    .xterm-viewport {
      width: 100% !important;
      height: 100% !important;
    }
    .xterm-viewport {
      background-color: rgb(33, 39, 50) !important;
    }
  </style>
</head>
<body>
<div class="boot" id="status">Booting Apptron runtime...</div>
<div id="loader" style="display:none"><p class="loader-status"></p></div>
<script>
  // Required by boot.go: window.apptron must be set before WASM starts
  const bootParams = new URLSearchParams(window.location.search);
  const defaultUser = {
    username: bootParams.get("user") || "root",
    user_id: bootParams.get("user_id") || "local",
  };
  const hostedOnTraitsDomain =
    window.location.hostname === "traits.build" ||
    window.location.hostname.endsWith(".traits.build");
  const defaultOrigin = hostedOnTraitsDomain ? "https://relay.traits.build" : window.location.origin;

  window.apptron = {
    origin: bootParams.get("origin") || defaultOrigin,
    mode: bootParams.get("mode") || "console",
    embedded: bootParams.get("embedded") === "true" ? true : false,
    user: defaultUser,
    publishURL: async () => window.location.origin,
  };
</script>
<script type="module">
  import "./wanix.min.js";

  const status = document.getElementById("status");
  const qp = new URLSearchParams(window.location.search);
  const RELAY_DATA_ORIGIN = "https://relay.traits.build";
  const LEGACY_RELAY_URL = "wss://relay.traits.build/x/net";
  const DEFAULT_RELAY_URL = "wss://relay.traits.build/linux/tunnel";

  function normalizeRelayUrl(url) {
    return url === LEGACY_RELAY_URL ? DEFAULT_RELAY_URL : url;
  }

  function configuredRelayUrl() {
    const relayParam = qp.get("relay_url");
    return normalizeRelayUrl(relayParam || DEFAULT_RELAY_URL);
  }

  function wsNetUrlForOrigin(originLike) {
    try {
      const origin = new URL(originLike);
      const wsProto = origin.protocol === "https:" ? "wss:" : "ws:";
      return `${wsProto}//${origin.host}/x/net`;
    } catch {
      return "";
    }
  }

  function installDataFetchProxy() {
    const nativeFetch = globalThis.fetch?.bind(globalThis);
    if (!nativeFetch) return;

    globalThis.fetch = (input, init) => {
      try {
        const raw = typeof input === "string"
          ? input
          : (input && typeof input.url === "string" ? input.url : "");
        if (raw) {
          const resolved = new URL(raw, window.location.origin);
          if (resolved.origin === window.location.origin && resolved.pathname.startsWith("/data/")) {
            const target = new URL(`${RELAY_DATA_ORIGIN}${resolved.pathname}${resolved.search}`);
            if (typeof input === "string") {
              return nativeFetch(target.toString(), init);
            }
            if (input instanceof Request) {
              return nativeFetch(new Request(target.toString(), input));
            }
          }
        }
      } catch {
        // Fall back to native fetch for all parsing/rewriting errors.
      }
      return nativeFetch(input, init);
    };
  }

  installDataFetchProxy();

  async function probeWebSocket(url, timeoutMs = 1200) {
    if (!url) return false;
    return await new Promise((resolve) => {
      let settled = false;
      let ws;
      const finalize = (ok) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (ws) {
          try {
            ws.close();
          } catch {
            // ignore close errors during probe
          }
        }
        resolve(ok);
      };
      const timer = setTimeout(() => finalize(false), timeoutMs);
      try {
        ws = new WebSocket(url);
        ws.onopen = () => finalize(true);
        ws.onerror = () => finalize(false);
        ws.onclose = () => finalize(false);
      } catch {
        finalize(false);
      }
    });
  }

  async function selectNetwork() {
    const explicit = qp.get("network");
    if (explicit) {
      return { network: normalizeRelayUrl(explicit), source: "query" };
    }

    if (qp.get("relay") === "off") {
      return {
        network: wsNetUrlForOrigin(window.location.origin),
        source: "origin-net"
      };
    }

    // On localhost: probe the local apptron worker first (default port 8080)
    const hostname = window.location.hostname;
    const isLocal = hostname === "127.0.0.1" || hostname === "localhost" || hostname === "::1";
    if (isLocal) {
      const localWorkerUrl = qp.get("worker_url") || "ws://127.0.0.1:8080/x/net";
      const localOk = await probeWebSocket(localWorkerUrl, 800);
      if (localOk) {
        return { network: localWorkerUrl, source: "local-worker" };
      }
    }

    const relayUrl = configuredRelayUrl();
    const relayOk = await probeWebSocket(relayUrl, 1200);
    if (relayOk) {
      return { network: relayUrl, source: "default-relay" };
    }

    const originNet = wsNetUrlForOrigin(window.location.origin);
    return { network: originNet || relayUrl, source: "origin-net" };
  }

  function shSingleQuote(value) {
    return `'${String(value).replace(/'/g, `'"'"'`)}'`;
  }

  function relayRcLines(network, source) {
    const relayUrl = configuredRelayUrl();
    return [
      "# traits.build relay bootstrap",
      `export WANIX_DEFAULT_RELAY=${relayUrl}`,
      `export WANIX_NETWORK=${network}`,
      `export WANIX_NETWORK_SOURCE=${source}`,
      "alias relay_status='echo WANIX_DEFAULT_RELAY=$WANIX_DEFAULT_RELAY; echo WANIX_NETWORK=$WANIX_NETWORK; echo WANIX_NETWORK_SOURCE=$WANIX_NETWORK_SOURCE'"
    ];
  }

  function relayBootstrapCommand(network, source) {
    const rcPath = "/tmp/.traits-relay.sh";
    const quotedLines = relayRcLines(network, source).map((line) => shSingleQuote(line)).join(" ");
    // Some shells can drop a few leading bytes on early boot writes; duplicate the write command.
    return `zz; printf '%s\\n' ${quotedLines} > ${rcPath}; printf '%s\\n' ${quotedLines} > ${rcPath}; . ${rcPath}`;
  }

  async function bootstrapRelayInShell(runtime, terminalId, network, source) {
    const command = relayBootstrapCommand(network, source);
    try {
      await runtime.writeFile(`web/dom/${terminalId}/data`, `${command}\n`);
    } catch {
      // Optional bootstrap only; shell remains usable without relay rc injection.
    }
  }

  const selectedNetwork = await selectNetwork();
  status.textContent = `Booting Apptron runtime (${selectedNetwork.source})...`;

  const runtime = new WanixRuntime({
    screen: false,
    helpers: true,
    debug9p: qp.get("debug9p") === "true",
    wasm: qp.get("wasm") || "./wanix.wasm",
    bundle: qp.get("bundle") || "./bundles/sys.tar.gz",
    network: selectedNetwork.network
  });

  // Enable on-demand bundle loading (Go toolchain etc.) via relay proxy
  runtime._getBundle = async (name) => {
    const url = `https://relay.traits.build/${name}`;
    console.log('[bundle] fetching', name);
    const cache = await caches.open('apptron-bundles');
    const cached = await cache.match(url);
    if (cached) {
      console.log('[bundle] cache hit', name);
      return await cached.arrayBuffer();
    }
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Bundle fetch failed: ${resp.status} ${name}`);
    await cache.put(url, resp.clone());
    console.log('[bundle] cached', name);
    return await resp.arrayBuffer();
  };

  window.apptron.instance = runtime;

  try {
    await runtime.ready();
    const ideBridgeMode = qp.get("ide_bridge") === "1";
    if (ideBridgeMode) {
      status.textContent = `Apptron runtime ready for IDE bridge (${selectedNetwork.source})`;
    } else {
      const terminalId = (await runtime.readText("web/dom/new/xterm")).trim();
      window.apptron.terminalId = terminalId;
      await runtime.writeFile("task/1/ctl", `bind #console/data web/dom/${terminalId}/data`);
      await runtime.writeFile("web/dom/body/ctl", `append-child ${terminalId}`);
      await bootstrapRelayInShell(runtime, terminalId, selectedNetwork.network, selectedNetwork.source);
      status.textContent = `Apptron shell ready (${selectedNetwork.source})`;
    }
    status.classList.add("ready");
  } catch (error) {
    console.error("Apptron console bootstrap failed", error);
    status.textContent = `Apptron boot failed: ${error?.message || error}`;
  }
</script>
</body>
</html>
