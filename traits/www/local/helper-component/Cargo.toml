[package]
name = "www-local-helper-component"
version = "0.1.0"
edition = "2021"
description = "www.local.helper as a WebAssembly Component Model component"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.39", features = ["bitflags"] }

[package.metadata.component]
package = "traits:www-helper"

[package.metadata.component.target]
path = "wit"
world = "helper-world"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
