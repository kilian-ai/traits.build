[package]
name = "sys-echo-component"
version = "0.1.0"
edition = "2021"
description = "sys.echo as a WebAssembly Component Model component"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.39", features = ["bitflags"] }
serde_json = "1"

[package.metadata.component]
package = "traits:sys-echo"

[package.metadata.component.target]
path = "wit"
world = "echo-world"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
