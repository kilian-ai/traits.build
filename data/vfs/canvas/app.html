<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Calculator</title>
<style>
    body { background: #0a0a0a; color: #e0e0e0; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 50px; }
    input { padding: 10px; width: 50px; text-align: center; }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>
<h1>Simple Calculator</h1>
<input type="text" id="num1" placeholder="0" />
<select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
</select>
<input type="text" id="num2" placeholder="0" />
<button id="calculate">Calculate</button>
<h2 id="result"></h2>
<script>
    const calculateBtn = document.getElementById('calculate');
    const result = document.getElementById('result');

    calculateBtn.addEventListener('click', () => {
        const num1 = parseFloat(document.getElementById('num1').value);
        const operator = document.getElementById('operator').value;
        const num2 = parseFloat(document.getElementById('num2').value);
        let calcResult;

        if (operator === '+') {
            calcResult = num1 + num2;
        } else if (operator === '-') {
            calcResult = num1 - num2;
        } else if (operator === '*') {
            calcResult = num1 * num2;
        } else if (operator === '/') {
            calcResult = num1 / num2;
        }

        result.textContent = 'Result: ' + calcResult;
    });
</script>
</body>
</html>
