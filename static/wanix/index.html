<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanix Local Shell</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }
    wanix-terminal {
      height: 100%;
      display: block;
    }
    .xterm-viewport {
      background-color: rgb(45, 45, 45) !important;
    }
  </style>
</head>
<body>
<script type="module">
  import "./wanix.min.js";

  const qp = new URLSearchParams(window.location.search);

  const system = document.createElement("wanix-system");
  system.id = "wanix-main";
  system.setAttribute("helpers", "");
  system.setAttribute("wasm", qp.get("wasm") || "./wanix.wasm");
  system.setAttribute("bundle", qp.get("bundle") || "./shell.tgz");
  if (qp.get("export9p") === "true") system.setAttribute("export9p", "");
  if (qp.get("screen") === "true") system.setAttribute("screen", "");
  if (qp.get("debug9p") === "true") system.setAttribute("debug9p", "");
  document.body.appendChild(system);

  const w = await system.ready();
  console.log("wanix local shell ready", w);

  const term = document.createElement("wanix-terminal");
  term.setAttribute("for", "wanix-main");
  term.setAttribute("src", "#console/data");
  document.body.appendChild(term);

  try {
    const initJS = await system.readText("#bundle/init.js");
    const blob = new Blob([initJS], { type: "text/javascript" });
    const initUrl = URL.createObjectURL(blob);
    const initModule = await import(initUrl);
    await initModule.default(w);
  } catch (_err) {
    console.log("No bundle init.js found");
  }
</script>
</body>
</html>
