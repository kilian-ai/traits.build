<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron IDE - traits.build</title>
  <link rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
  <link rel="stylesheet" href="./styles-vscode.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.88);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    vscode-workbench {
      flex: 1;
      min-height: 0;
      display: flex;
    }
  </style>
</head>
<body>
  <div class="boot" id="status">Booting Apptron IDE...</div>
  <vscode-workbench></vscode-workbench>

  <script>
    window.APPTRON_BASE = '/static/apptron-ide';
    window.APPTRON_DISABLE_SYSTEM_EXTENSION = true;
  </script>

  <script type="module">
    import './lib/vscode.js';

    const status = document.getElementById('status');
    const workbench = document.querySelector('vscode-workbench');
    workbench.mount();
    workbench.addEventListener('vscode-ready', () => {
      status.textContent = 'Apptron IDE ready';
      status.classList.add('ready');
    }, { once: true });
  </script>
</body>
</html>
