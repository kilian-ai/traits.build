<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron IDE - traits.build</title>
  <link rel="stylesheet" href="./vscode/out/vs/workbench/workbench.web.main.css">
  <link rel="stylesheet" href="./styles-vscode.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      min-height: 100vh;
    }
    #layout {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 50;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.88);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    body.resizing {
      cursor: row-resize;
      user-select: none;
    }
    #ide-panel {
      position: relative;
      flex: 0 0 62%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-bottom: 1px solid #2d3d5f;
      background: #0f141b;
    }
    #ide-panel > vscode-workbench {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 0;
      position: relative !important;
      inset: auto !important;
      flex: none !important;
    }
    #shell-panel {
      flex: 1;
      min-width: 0;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }
    #resize-handle {
      flex: 0 0 10px;
      height: 10px;
      cursor: row-resize;
      background: linear-gradient(180deg, #223352 0%, #2d3d5f 50%, #223352 100%);
      border-top: 1px solid #31466f;
      border-bottom: 1px solid #1a273f;
      touch-action: none;
    }
    #shell-panel iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="boot" id="status">Booting Apptron IDE...</div>
  <div id="layout">
    <div id="ide-panel">
      <vscode-workbench></vscode-workbench>
    </div>
    <div id="resize-handle" aria-label="Resize panels" role="separator"></div>
    <div id="shell-panel">
      <iframe src="/static/apptron/index.html" allow="clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
  </div>

  <script>
    window.APPTRON_BASE = '/static/apptron-ide';
    const __apptronIdeParams = new URLSearchParams(window.location.search);
    window.APPTRON_DISABLE_SYSTEM_EXTENSION = __apptronIdeParams.get('system_ext') === 'off';
    window.apptron = { instance: null, ready: null };
  </script>

  <script type="module">
    import './lib/vscode.js';

    const status = document.getElementById('status');
    const workbench = document.querySelector('vscode-workbench');
    const layout = document.getElementById('layout');
    const idePanel = document.getElementById('ide-panel');
    const resizeHandle = document.getElementById('resize-handle');
    const params = new URLSearchParams(window.location.search);
    const SPLIT_KEY = 'apptron.ide.split.height';

    function setupHorizontalResize() {
      if (!layout || !idePanel || !resizeHandle) return;

      try {
        const saved = parseInt(localStorage.getItem(SPLIT_KEY) || '', 10);
        if (!Number.isNaN(saved) && saved > 120) {
          idePanel.style.flex = `0 0 ${saved}px`;
        }
      } catch {
      }

      let dragging = false;
      let startY = 0;
      let startHeight = 0;

      const onMove = (event) => {
        if (!dragging) return;
        const deltaY = event.clientY - startY;
        const handleHeight = resizeHandle.offsetHeight || 10;
        const minHeight = 140;
        const maxHeight = Math.max(minHeight, layout.clientHeight - minHeight - handleHeight);
        const next = Math.max(minHeight, Math.min(maxHeight, startHeight + deltaY));
        idePanel.style.flex = `0 0 ${next}px`;
      };

      const stopDrag = () => {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove('resizing');
        try {
          localStorage.setItem(SPLIT_KEY, String(Math.round(idePanel.getBoundingClientRect().height)));
        } catch {
        }
      };

      resizeHandle.addEventListener('pointerdown', (event) => {
        dragging = true;
        startY = event.clientY;
        startHeight = idePanel.getBoundingClientRect().height;
        document.body.classList.add('resizing');
        try {
          resizeHandle.setPointerCapture(event.pointerId);
        } catch {
        }
      });

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);
    }

    setupHorizontalResize();

    function shellCacheBustValue() {
      const explicit = params.get('cb');
      return explicit || String(Date.now());
    }

    function hiddenShellUrl() {
      const shellParams = new URLSearchParams();
      shellParams.set('embedded', 'true');
      shellParams.set('mode', 'console');
      shellParams.set('ide_bridge', '1');
      for (const key of ['network', 'relay', 'relay_url', 'worker_url', 'origin', 'debug9p', 'wasm', 'bundle', 'cb', 'term_path', 'ide_xterm']) {
        const value = params.get(key);
        if (value) {
          shellParams.set(key, value);
        }
      }
      if (!shellParams.get('cb')) {
        shellParams.set('cb', shellCacheBustValue());
      }
      return `/static/apptron/index.html?${shellParams.toString()}`;
    }

    async function waitRuntimeReadyBounded(runtime, maxWaitMs = 8000) {
      if (!runtime || typeof runtime.ready !== 'function') return;
      let timeoutId;
      const timeoutPromise = new Promise((resolve) => {
        timeoutId = setTimeout(resolve, maxWaitMs);
      });
      try {
        await Promise.race([runtime.ready(), timeoutPromise]);
      } catch {
        // Continue with runtime handoff even if ready() rejects.
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function createWanixPortWithRetry(runtime, onProgress, maxWaitMs = 0) {
      const started = Date.now();
      let lastProgressSec = -1;
      while (true) {
        try {
          const wanixPort = await runtime.createPort();
          if (wanixPort) {
            return wanixPort;
          }
        } catch {
          // Retry while hidden shell runtime finishes initialization.
        }
        const elapsedMs = Date.now() - started;
        const elapsedSec = Math.floor(elapsedMs / 1000);
        if (elapsedSec !== lastProgressSec && elapsedSec % 5 === 0) {
          lastProgressSec = elapsedSec;
          if (typeof onProgress === 'function') {
            onProgress(elapsedSec);
          }
        }
        if (maxWaitMs > 0 && elapsedMs > maxWaitMs) {
          throw new Error(`Timed out waiting for hidden-shell wanix port after ${Math.floor(maxWaitMs / 1000)}s`);
        }
        await new Promise((resolve) => setTimeout(resolve, 200));
      }
    }

    async function bootRuntime() {
      const iframe = document.createElement('iframe');
      iframe.src = hiddenShellUrl();
      iframe.style.position = 'fixed';
      iframe.style.left = '-10000px';
      iframe.style.top = '0';
      iframe.style.width = '1px';
      iframe.style.height = '1px';
      iframe.style.opacity = '0';
      iframe.style.pointerEvents = 'none';
      iframe.style.border = '0';
      iframe.setAttribute('aria-hidden', 'true');
      document.body.appendChild(iframe);

      const started = Date.now();
      const timeoutMs = 30000;

      return new Promise((resolve, reject) => {
        const probe = async () => {
          try {
            const runtime = iframe.contentWindow?.apptron?.instance;
            if (runtime) {
              await waitRuntimeReadyBounded(runtime);
              window.apptron.instance = runtime;
              resolve(runtime);
              return;
            }
          } catch {
            // Keep polling until timeout while shell frame boots.
          }

          if (Date.now() - started > timeoutMs) {
            reject(new Error('Apptron shell runtime did not initialize in time'));
            return;
          }

          setTimeout(probe, 150);
        };

        iframe.addEventListener('load', () => {
          void probe();
        });
        void probe();
      });
    }

    async function setupVSCodeSettings(runtime) {
      if (!runtime) return;
      // NOTE: Markdown preview requires VS Code Web's sandboxed subdomains (e.g., UUID.traits.build).
      // These subdomains must resolve via DNS (either wildcard *.traits.build or relay proxy).
      // Without DNS resolution, markdown preview will show "server IP not found" error.
      // 
      // Do NOT set 'markdown.experimental.useSandbox': false as it breaks rendering entirely.
      //
      // Temporary limitation: markdown preview unavailable in sandboxed browser IDE until:
      // - DNS wildcard configured for *.traits.build, OR
      // - Relay worker proxies markdown preview subdomains, OR
      // - Different VS Code variant used (e.g., native app vs web)
      const vscodeSettingsPath = 'vm/1/fsys/home/root/.config/Code/User/settings.json';
      const settingsDir = 'vm/1/fsys/home/root/.config/Code/User';
      try {
        // Create directory structure if needed
        await withTimeout(runtime.makeDir('vm/1/fsys/home/root'), 1000).catch(() => {});
        await withTimeout(runtime.makeDir('vm/1/fsys/home/root/.config'), 1000).catch(() => {});
        await withTimeout(runtime.makeDir('vm/1/fsys/home/root/.config/Code'), 1000).catch(() => {});
        await withTimeout(runtime.makeDir(settingsDir), 1000).catch(() => {});
        
        // Read existing settings if they exist
        let settings = {};
        try {
          const existing = await withTimeout(runtime.readFile(vscodeSettingsPath), 1000);
          if (existing && typeof existing === 'string') {
            try { settings = JSON.parse(existing); } catch { }
          }
        } catch { }
        
        // Configure safe VS Code defaults (but do NOT disable sandbox)
        const newSettings = {
          ...settings,
          'workbench.colorTheme': 'Default Dark Modern',
          'editor.wordWrap': 'on',
          'markdown.preview.fontSize': 14,
        };
        
        await withTimeout(
          runtime.writeFile(vscodeSettingsPath, JSON.stringify(newSettings, null, 2)),
          1000
        );
        console.log('[IDE] VS Code settings configured');
      } catch (error) {
        console.warn('[IDE] Failed to set up VS Code settings:', error);
      }
    }

    window.apptron.ready = bootRuntime()
      .then((runtime) => {
        status.textContent = 'Runtime ready, configuring editor...';
        return runtime && setupVSCodeSettings(runtime).then(() => runtime);
      })
      .catch((error) => {
        console.error('Wanix boot failed:', error);
        status.textContent = 'Runtime failed, starting editor anyway...';
        return null;
      });

    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || !data.port) return;

      const receiverPort = data.port;
      const runtime = await window.apptron.ready;
      if (!runtime) {
        return;
      }

      try {
        status.textContent = 'Loading WASM kernel...';
        const wanixPort = await createWanixPortWithRetry(runtime, (elapsedSec) => {
          status.textContent = `Loading WASM kernel... ${elapsedSec}s`;
        });
        receiverPort.postMessage({ wanix: wanixPort }, [wanixPort]);
      } catch (error) {
        console.error('Failed to hand off wanix port:', error);
        status.textContent = 'WASM kernel failed to initialize. Reload to retry.';
      }
    });

    // --- Clipboard fallback for terminal paste ---
    // VS Code terminal calls navigator.clipboard.readText() which needs
    // explicit browser permission. The editor works because it uses native
    // paste events. Capture paste-event text as fallback for the API.
    {
      let lastPasteText = '';
      document.addEventListener('paste', (e) => {
        if (e.clipboardData) lastPasteText = e.clipboardData.getData('text/plain');
      }, true);
      const orig = navigator.clipboard.readText.bind(navigator.clipboard);
      navigator.clipboard.readText = async () => {
        try { return await orig(); }
        catch { return lastPasteText; }
      };
    }

    workbench.addEventListener('vscode-ready', () => {
      status.textContent = 'Apptron IDE ready';
      status.classList.add('ready');
    }, { once: true });

    workbench.mount();

    // --- Apptron Publishing (Service Worker + VFS auto-sync) ---
    const PUBLISH_SW_URL = '/static/apptron-ide/publish-sw.js';
    const PUBLISH_SCOPE = '/static/apptron-ide/';
    const PUBLISH_PREFIX = '/static/apptron-ide/public/';
    const MANUAL_TRIGGER_PATH = 'vm/1/fsys/home/root/.publish-now';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register(PUBLISH_SW_URL, { scope: PUBLISH_SCOPE })
        .then(() => console.log('[publish] SW registered'))
        .catch((err) => console.warn('[publish] SW registration failed:', err));
    }

    const MIME = {
      html: 'text/html;charset=utf-8', htm: 'text/html;charset=utf-8',
      css: 'text/css;charset=utf-8', js: 'application/javascript;charset=utf-8',
      mjs: 'application/javascript;charset=utf-8',
      json: 'application/json;charset=utf-8', txt: 'text/plain;charset=utf-8',
      md: 'text/plain;charset=utf-8', xml: 'application/xml',
      svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg',
      jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
      ico: 'image/x-icon', woff: 'font/woff', woff2: 'font/woff2',
      pdf: 'application/pdf', wasm: 'application/wasm',
    };
    function guessMime(name) {
      return MIME[(name.split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
    }
    function withTimeout(p, ms) {
      return Promise.race([p, new Promise((_, r) => setTimeout(() => r('timeout'), ms))]);
    }

    function toText(value) {
      if (value == null) return '';
      if (typeof value === 'string') return value;
      if (value instanceof Uint8Array) {
        try { return new TextDecoder().decode(value); }
        catch { return String(value); }
      }
      if (value instanceof ArrayBuffer) {
        try { return new TextDecoder().decode(new Uint8Array(value)); }
        catch { return String(value); }
      }
      if (Array.isArray(value) && value.every((n) => typeof n === 'number')) {
        try { return new TextDecoder().decode(new Uint8Array(value)); }
        catch { return String(value); }
      }
      return String(value);
    }

    async function getPublishWorker() {
      if (!('serviceWorker' in navigator)) return null;
      if (navigator.serviceWorker.controller) return navigator.serviceWorker.controller;
      try {
        const reg = await navigator.serviceWorker.ready;
        return reg.active || reg.waiting || reg.installing || null;
      } catch {
        return null;
      }
    }

    // Recursively collect files from /home/root/public (depth-limited).
    async function collectPublic(runtime, prefix, depth) {
      if (depth > 3) return [];
      const base = 'vm/1/fsys/home/root/public' + (prefix ? '/' + prefix : '');
      let entries;
      try { entries = await withTimeout(runtime.readDir(base), 2000); }
      catch { return []; }
      if (!Array.isArray(entries)) return [];

      const files = [];
      for (const name of entries) {
        const rel = prefix ? prefix + '/' + name : name;
        try {
          const body = await withTimeout(runtime.readFile(base + '/' + name), 2000);
          if (body != null) files.push({ rel, body });
        } catch {
          // Probably a directory — recurse.
          const sub = await collectPublic(runtime, rel, depth + 1);
          files.push(...sub);
        }
      }
      return files;
    }

    function bodyDigest(body) {
      if (typeof body === 'string') {
        let h = 5381;
        for (let i = 0; i < body.length; i += 1) h = ((h << 5) + h) ^ body.charCodeAt(i);
        return `s:${body.length}:${h >>> 0}`;
      }
      let bytes;
      if (body instanceof Uint8Array) {
        bytes = body;
      } else if (body instanceof ArrayBuffer) {
        bytes = new Uint8Array(body);
      } else if (Array.isArray(body) && body.every((n) => typeof n === 'number')) {
        bytes = new Uint8Array(body);
      } else if (body && typeof body === 'object') {
        const keys = Object.keys(body);
        if (keys.length && keys.every((k) => /^\d+$/.test(k))) {
          const arr = keys
            .map((k) => [Number(k), body[k]])
            .sort((a, b) => a[0] - b[0])
            .map(([, v]) => Number(v));
          bytes = new Uint8Array(arr);
        }
      }
      if (!bytes) {
        const fallback = String(body ?? '');
        let h = 5381;
        for (let i = 0; i < fallback.length; i += 1) h = ((h << 5) + h) ^ fallback.charCodeAt(i);
        return `x:${fallback.length}:${h >>> 0}`;
      }
      let h = 5381;
      for (let i = 0; i < bytes.length; i += 1) h = ((h << 5) + h) ^ bytes[i];
      return `b:${bytes.length}:${h >>> 0}`;
    }

    let _syncing = false;
    let _published = new Set();
    let _publishedDigest = new Map();
    let _lastManualToken = '';

    async function syncPublish(force = false) {
      const runtime = window.apptron.instance;
      const sw = await getPublishWorker();
      if (!runtime || !sw || _syncing) return;
      _syncing = true;
      try {
        const files = await collectPublic(runtime, '', 0);
        const current = new Set(files.map((f) => f.rel));
        let changed = 0;

        for (const { rel, body } of files) {
          const digest = bodyDigest(body);
          const prev = _publishedDigest.get(rel);
          if (force || prev !== digest) {
            sw.postMessage({
              type: 'publish-file', path: PUBLISH_PREFIX + rel,
              body, contentType: guessMime(rel),
            });
            _publishedDigest.set(rel, digest);
            changed += 1;
          }
          _published.add(rel);
        }
        // Remove files that were published before but no longer exist.
        for (const rel of _published) {
          if (!current.has(rel)) {
            sw.postMessage({ type: 'unpublish-file', path: PUBLISH_PREFIX + rel });
            _published.delete(rel);
            _publishedDigest.delete(rel);
          }
        }
        if (files.length || changed || force) {
          console.log(`[publish] Synced ${files.length} file(s), changed ${changed}${force ? ' (forced)' : ''} → ${location.origin}${PUBLISH_PREFIX}`);
        }
      } catch { /* ignore */ }
      finally { _syncing = false; }
    }

    async function checkManualPublishTrigger(rt) {
      let token;
      try {
        token = await withTimeout(rt.readFile(MANUAL_TRIGGER_PATH), 500);
      } catch {
        return;
      }
      if (token == null) return;
      const nextToken = toText(token).trim();
      if (!nextToken || nextToken === _lastManualToken) return;
      _lastManualToken = nextToken;
      await syncPublish(true);
      console.log(`[publish] Manual trigger executed (${nextToken})`);
    }

    // Ensure /home/root/public exists in the guest FS.
    // This path is under home and persists with user storage semantics.
    async function ensurePublicDir(rt) {
      try { await withTimeout(rt.makeDir('vm/1/fsys/home/root/public'), 2000); }
      catch { /* already exists or not yet ready — sync loop will retry via readDir */ }
    }

    const PUBLIC_VIEWER_PATH = 'vm/1/fsys/home/root/public/viewer.html';
    const PUBLIC_VIEWER_MARKER = '<!-- apptron-public-viewer:v1 -->';

    function publicViewerTemplate() {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public Files</title>
  ${PUBLIC_VIEWER_MARKER}
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1117;
      --panel: #121b26;
      --panel-strong: #182434;
      --line: #2b4158;
      --text: #dbe7f5;
      --muted: #88a1bc;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 26%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.12), transparent 28%),
        var(--bg);
      color: var(--text);

    }

      padding: 24px;

      max-width: 1400px;

      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;

    }

      background: linear-gradient(180deg, rgba(24, 36, 52, 0.96), rgba(14, 22, 33, 0.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
    }

      display: flex;
      flex-direction: column;
    }
    .hero, .preview-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(136, 161, 188, 0.16);
      background: linear-gradient(180deg, rgba(125, 211, 252, 0.08), rgba(125, 211, 252, 0));
    }

      font-size: 11px;

    .row {
      display: grid;

    }
    .row:hover {

    .row.active {

    .name {

    #current-path {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
    }
    #preview-frame {
      border: none;
      width: 100%;
      flex: 1;
      min-height: 520px;
      background: white;
    }
    .bridge {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -10000px;
      top: 0;
      opacity: 0.001;
      pointer-events: none;
      border: 0;
    }
    @media (max-width: 960px) {
      body { padding: 14px; }
      .shell { grid-template-columns: 1fr; min-height: auto; }
      #preview-frame { min-height: 360px; }
    }
  </style>
</head>
<body>
  <iframe id="wanix-bridge" class="bridge" src="/static/apptron/index.html?embedded=true&viewer=1&cb=" title="Wanix runtime bridge"></iframe>
  <main class="shell">
    <section class="panel sidebar">
      <div class="hero">
        <div class="eyebrow">Apptron Public Viewer</div>
        <h1>~/public</h1>
        <p class="sub">This page reads the Wanix VFS directly from <code>/home/root/public</code> and opens files through the published Apptron IDE path.</p>
        <div class="toolbar">
          <button id="refresh" type="button">Refresh Files</button>
          <a class="link" id="open-current" href="/static/apptron-ide/public/viewer.html" target="_blank" rel="noopener noreferrer">Open Current File</a>
        </div>
        <div id="status">Booting Wanix runtime…</div>
      </div>
      <ul id="file-list"></ul>
    </section>
    <section class="panel preview">
      <div class="preview-head">
        <div class="eyebrow">Preview</div>
        <div id="current-path">Select a file from the list.</div>
      </div>
      <div class="preview-body">
        <iframe id="preview-frame" title="File preview"></iframe>
      </div>
    </section>
  </main>
  <script>
    const SOURCE_ROOT = 'vm/1/fsys/home/root/public';
    const PUBLISHED_PREFIX = '/static/apptron-ide/public/';
    const BRIDGE_BASE = '/static/apptron/index.html?embedded=true&viewer=1&cb=';
    const bridge = document.getElementById('wanix-bridge');
    const statusEl = document.getElementById('status');
    const fileListEl = document.getElementById('file-list');
    const previewFrame = document.getElementById('preview-frame');
    const currentPathEl = document.getElementById('current-path');
    const openCurrentEl = document.getElementById('open-current');
    const refreshButton = document.getElementById('refresh');
    let activeRel = 'viewer.html';

    bridge.src = BRIDGE_BASE + Date.now();

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char] || char));
    }

    function encodePublishedPath(rel) {
      return PUBLISHED_PREFIX + rel.split('/').map((part) => encodeURIComponent(part)).join('/');
    }

    function kindFor(rel) {
      const ext = rel.split('.').pop().toLowerCase();
      if (['html', 'htm'].includes(ext)) return 'html';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
      if (['json', 'txt', 'md', 'js', 'css', 'xml'].includes(ext)) return 'text';
      if (ext === 'pdf') return 'pdf';
      return ext || 'file';
    }

    function byRel(a, b) {
      return a.rel.localeCompare(b.rel, undefined, { numeric: true, sensitivity: 'base' });
    }

    async function waitForRuntime() {
      const frameWindow = bridge.contentWindow;
      if (!frameWindow) throw new Error('Viewer bridge frame unavailable');
      const deadline = Date.now() + 60000;
      while (Date.now() < deadline) {
        const ready = frameWindow.apptron && frameWindow.apptron.ready;
        if (ready) return await ready;
        await new Promise((resolve) => setTimeout(resolve, 250));
      }
      throw new Error('Timed out waiting for Wanix runtime');
    }

    async function withTimeout(promise, ms) {
      return await Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timed out after ' + ms + 'ms')), ms))
      ]);
    }

    async function collectFiles(runtime, prefix, depth) {
      if (depth > 6) return [];
      const base = SOURCE_ROOT + (prefix ? '/' + prefix : '');
      let entries;
      try {
        entries = await withTimeout(runtime.readDir(base), 2000);
      } catch {
        return [];
      }
      if (!Array.isArray(entries)) return [];

      const results = [];
      for (const name of entries) {
        const rel = prefix ? prefix + '/' + name : name;
        try {
          const body = await withTimeout(runtime.readFile(base + '/' + name), 1200);
          if (body != null) {
            results.push({ rel, kind: kindFor(rel) });
            continue;
          }
        } catch {
        }
        const sub = await collectFiles(runtime, rel, depth + 1);
        results.push.apply(results, sub);
      }
      return results.sort(byRel);
    }

    function openPreview(rel) {
      activeRel = rel;
      const path = encodePublishedPath(rel);
      previewFrame.src = path;
      currentPathEl.textContent = rel;
      openCurrentEl.href = path;
      openCurrentEl.textContent = 'Open ' + rel;
      for (const row of fileListEl.querySelectorAll('.row')) {
        row.classList.toggle('active', row.dataset.rel === rel);
      }
    }

    function renderFiles(files) {
      if (!files.length) {
        fileListEl.innerHTML = '<li class="empty">No files found in ~/public yet.</li>';
        return;
      }
      fileListEl.innerHTML = files.map((file) =>
        '<li>' +
          '<a class="row' + (file.rel === activeRel ? ' active' : '') + '" href="' + escapeHtml(encodePublishedPath(file.rel)) + '" data-rel="' + escapeHtml(file.rel) + '">' +
            '<span class="name">' + escapeHtml(file.rel) + '</span>' +
            '<span class="meta">' + escapeHtml(file.kind) + '</span>' +
          '</a>' +
        '</li>'
      ).join('');
      for (const row of fileListEl.querySelectorAll('.row')) {
        row.addEventListener('click', (event) => {
          event.preventDefault();
          openPreview(row.dataset.rel);
        });
      }
      if (!files.some((file) => file.rel === activeRel)) {
        activeRel = files[0].rel;
      }
      openPreview(activeRel);
    }

    async function refreshFiles() {
      setStatus('Reading ~/public…');
      try {
        const runtime = await waitForRuntime();
        const files = await collectFiles(runtime, '', 0);
        renderFiles(files);
        setStatus('Found ' + files.length + ' file' + (files.length === 1 ? '' : 's') + ' in ~/public.');
      } catch (error) {
        fileListEl.innerHTML = '<li class="empty">' + escapeHtml(error && error.message ? error.message : error) + '</li>';
        setStatus('Viewer bootstrap failed.');
      }
    }

    refreshButton.addEventListener('click', () => {
      refreshFiles();
    });

    setInterval(() => {
      refreshFiles();
    }, 5000);

    refreshFiles();
  <\/script>
</body>
</html>`;
    }

    async function ensurePublicViewer(rt) {
      let existing = null;
      try {
        existing = await withTimeout(rt.readFile(PUBLIC_VIEWER_PATH), 1200);
      } catch {
        existing = null;
      }
      if (typeof existing === 'string' && existing.includes(PUBLIC_VIEWER_MARKER)) return;
      if (existing != null) return;
      try {
        await withTimeout(rt.writeFile(PUBLIC_VIEWER_PATH, publicViewerTemplate()), 2000);
        console.log('[publish] Seeded ~/public/viewer.html');
      } catch (error) {
        console.warn('[publish] Failed to seed ~/public/viewer.html:', error);
      }
    }

    // Start periodic sync once both runtime and SW are active.
    window.apptron.ready.then(async (rt) => {
      if (!rt || !('serviceWorker' in navigator)) return;
      await ensurePublicDir(rt);
      await ensurePublicViewer(rt);
      window.apptronPublish = {
        now: () => syncPublish(true),
        status: () => ({ published: _published.size, scope: PUBLISH_SCOPE, prefix: PUBLISH_PREFIX, source: '/home/root/public' }),
      };
      navigator.serviceWorker.ready.then(() => {
        syncPublish(true);
        setInterval(async () => {
          await checkManualPublishTrigger(rt);
          await syncPublish(false);
        }, 5000);
      });
    });
  </script>
</body>
</html>
