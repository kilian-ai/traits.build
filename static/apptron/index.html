<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apptron Local Shell</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101418;
      color: #d7e2f7;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body {
      position: relative;
    }
    .boot {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      font-size: 12px;
      color: #8ea0c6;
      background: rgba(20, 29, 46, 0.85);
      border: 1px solid #2d3d5f;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .boot.ready {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .xterm {
      width: 100%;
      height: 100%;
    }
    .xterm-screen,
    .xterm-viewport {
      width: 100% !important;
      height: 100% !important;
    }
    .xterm-viewport {
      background-color: rgb(33, 39, 50) !important;
    }
  </style>
</head>
<body>
<div class="boot" id="status">Booting Apptron runtime...</div>
<div id="loader" style="display:none"><p class="loader-status"></p></div>
<script>
  // Required by boot.go: window.apptron must be set before WASM starts.
  // Setting `env` activates stock Apptron IndexedDB persistence (idbfs
  // "apptron-rev1") for /home/<username>, /project, and /public — no custom
  // JS VFS layer needed.
  const bootParams = new URLSearchParams(window.location.search);
  const defaultUser = {
    username: bootParams.get("user") || "root",
    user_id: bootParams.get("user_id") || "local",
  };
  const hostedOnTraitsDomain =
    window.location.hostname === "traits.build" ||
    window.location.hostname.endsWith(".traits.build");
  const defaultOrigin = hostedOnTraitsDomain ? "https://relay.traits.build" : window.location.origin;

  function stableEnvUuid(name) {
    const key = `apptron.env.uuid.${name}`;
    try {
      const existing = localStorage.getItem(key);
      if (existing) return existing;
      const fresh = (crypto && typeof crypto.randomUUID === "function")
        ? crypto.randomUUID()
        : `local-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      localStorage.setItem(key, fresh);
      return fresh;
    } catch {
      return `local-${name}`;
    }
  }

  const envName = bootParams.get("env_name") || "local";
  // By default we DO NOT define `env`. boot.go's project-fs goroutine does a
  // syncfs.Sync() that is log.Fatal on error (boot.go:597). Since we have no
  // authoritative /data backend (only a local-only ack relay), the remote list
  // returns "file does not exist" and kills the Go runtime. Opt-in via
  // `?with_env=1` for experimentation once a real /data backend is wired.
  const wantEnv = bootParams.get("with_env") === "1";

  window.apptron = {
    origin: bootParams.get("origin") || defaultOrigin,
    mode: bootParams.get("mode") || "console",
    embedded: bootParams.get("embedded") === "true" ? true : false,
    user: defaultUser,
    publishURL: async () => window.location.origin,
  };
  if (wantEnv) {
    window.apptron.env = {
      uuid: bootParams.get("env_uuid") || stableEnvUuid(envName),
      name: envName,
      owner: defaultUser.user_id,
    };
  }
</script>
<script>
// PIC shim: v86 npm v0.5.333 WASM lacks 14 PIC function exports that the Wanix
// blob worker expects. We intercept blob worker creation and prepend JS code that
// wraps WebAssembly.instantiate to add PIC shim functions via Proxy on exports.
// The shims operate on PIC state in WASM linear memory using get_pic_addr_master/slave.
(function() {
  const SHIM = `(function(){
var _wI=WebAssembly.instantiate,_wIS=WebAssembly.instantiateStreaming;
function shimIt(inst,imp){
  var ex=inst.exports;
  if(!ex||!ex.get_pic_addr_master||ex.pic_set_irq)return inst;
  var mem=(imp&&imp.env&&imp.env.memory)||ex.memory;
  if(!mem)return inst;
  // PIC struct: 0=irq_mask 1=irq_map 2=isr 3=irr 4=master 5=pad
  // 6=expect_icw4 7=state 8=read_isr 9=auto_eoi 10=elcr 11=irq_value 12=special_mask
  function p(s){return new Uint8Array(mem.buffer,s?ex.get_pic_addr_slave():ex.get_pic_addr_master(),13)}
  function hasPend(s){var q=p(s);return(q[3]&~q[0]&255)!==0}
  function chkSlv(){if(hasPend(1))shm.pic_set_irq(2);else shm.pic_clear_irq(2)}
  function wCmd(q,v){
    if(v&16){q[3]=0;q[2]=0;q[0]=0;q[11]=0;q[9]=0;q[6]=(v&1)?1:0;q[7]=1;q[8]=0}
    else if(v&8){if(v&2)q[8]=(v&1)?1:0;if(v&64)q[12]=(v&32)?1:0}
    else{var c=v>>5;if(c===1){var s=q[2];if(s){var b=0;while(b<8&&!(s&(1<<b)))b++;if(b<8)q[2]&=~(1<<b)&255}}
    else if(c===3)q[2]&=~(1<<(v&7))&255}
  }
  function wDat(q,v){
    var st=q[7];
    if(st===0)q[0]=v;
    else if(st===1){q[1]=v;q[7]=2}
    else if(st===2)q[7]=q[6]?3:0;
    else if(st===3){q[9]=(v&2)?1:0;q[7]=0}
  }
  var shm={
    pic_set_irq:function(i){var s=i>=8,b=i&7,m=1<<b,q=p(s);if(!(q[11]&m)||(q[10]&m)){q[3]|=m;q[11]|=m}if(s)chkSlv()},
    pic_clear_irq:function(i){var s=i>=8,b=i&7,m=1<<b,q=p(s);q[11]&=~m&255;if(q[10]&m)q[3]&=~m&255;if(s)chkSlv()},
    port20_read:function(){var q=p(0);return q[8]?q[2]:q[3]},
    port21_read:function(){return p(0)[0]},
    portA0_read:function(){var q=p(1);return q[8]?q[2]:q[3]},
    portA1_read:function(){return p(1)[0]},
    port4D0_read:function(){return p(0)[10]},
    port4D1_read:function(){return p(1)[10]},
    port20_write:function(v){wCmd(p(0),v)},
    port21_write:function(v){wDat(p(0),v)},
    portA0_write:function(v){wCmd(p(1),v)},
    portA1_write:function(v){wDat(p(1),v)},
    port4D0_write:function(v){p(0)[10]=v},
    port4D1_write:function(v){p(1)[10]=v}
  };
  var px=new Proxy(ex,{get:function(t,k){return shm[k]||t[k]}});
  return{exports:px};
}
WebAssembly.instantiate=function(s,imp){return _wI.call(WebAssembly,s,imp).then(function(r){
  if(r&&r.instance)return{module:r.module,instance:shimIt(r.instance,imp)};
  return shimIt(r,imp);
})};
if(_wIS)WebAssembly.instantiateStreaming=function(s,imp){return _wIS.call(WebAssembly,s,imp).then(function(r){
  if(r&&r.instance)return{module:r.module,instance:shimIt(r.instance,imp)};
  return shimIt(r,imp);
})};
})();\n`;

  var _origCOU = URL.createObjectURL.bind(URL);
  URL.createObjectURL = function(blob) {
    if (blob instanceof Blob && blob.size > 100000) {
      var bt = (blob.type || "").toLowerCase();
      // Only prepend to JS worker blobs; skip WASM/binary blobs.
      // JS worker blob (~388KB) has type "application/javascript".
      // WASM blob (~2MB) has type "application/wasm" or empty.
      if (bt.indexOf("javascript") >= 0 || (bt === "" && blob.size < 1500000)) {
        blob = new Blob([SHIM, blob], { type: blob.type || "application/javascript" });
      }
    }
    return _origCOU(blob);
  };
})();
</script>
<script type="module">
  import "./wanix.min.js";

  const status = document.getElementById("status");
  const qp = new URLSearchParams(window.location.search);
  const RELAY_DATA_ORIGIN = "https://relay.traits.build";
  const LEGACY_RELAY_URL = "wss://relay.traits.build/x/net";
  const DEFAULT_RELAY_URL = "wss://relay.traits.build/linux/tunnel";

  function normalizeRelayUrl(url) {
    return url === LEGACY_RELAY_URL ? DEFAULT_RELAY_URL : url;
  }

  function configuredRelayUrl() {
    const relayParam = qp.get("relay_url");
    return normalizeRelayUrl(relayParam || DEFAULT_RELAY_URL);
  }

  function wsNetUrlForOrigin(originLike) {
    try {
      const origin = new URL(originLike);
      const wsProto = origin.protocol === "https:" ? "wss:" : "ws:";
      return `${wsProto}//${origin.host}/x/net`;
    } catch {
      return "";
    }
  }

  function installDataFetchProxy() {
    const nativeFetch = globalThis.fetch?.bind(globalThis);
    if (!nativeFetch) return;

    globalThis.fetch = (input, init) => {
      try {
        const raw = typeof input === "string"
          ? input
          : (input && typeof input.url === "string" ? input.url : "");
        if (raw) {
          const resolved = new URL(raw, window.location.origin);
          if (resolved.origin === window.location.origin && resolved.pathname.startsWith("/data/")) {
            const target = new URL(`${RELAY_DATA_ORIGIN}${resolved.pathname}${resolved.search}`);
            if (typeof input === "string") {
              return nativeFetch(target.toString(), init);
            }
            if (input instanceof Request) {
              return nativeFetch(new Request(target.toString(), input));
            }
          }
        }
      } catch {
        // Fall back to native fetch for all parsing/rewriting errors.
      }
      return nativeFetch(input, init);
    };
  }

  installDataFetchProxy();

  async function probeWebSocket(url, timeoutMs = 1200) {
    if (!url) return false;
    return await new Promise((resolve) => {
      let settled = false;
      let ws;
      const done = (ok) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        try { ws && ws.close(); } catch {}
        resolve(ok);
      };
      const timer = setTimeout(() => done(false), timeoutMs);
      try {
        ws = new WebSocket(url);
        ws.onopen = () => done(true);
        ws.onerror = () => done(false);
        ws.onclose = () => done(false);
      } catch { done(false); }
    });
  }

  async function resolveNetwork() {
    const explicit = qp.get("network");
    if (explicit) return normalizeRelayUrl(explicit);
    if (qp.get("relay") === "off") {
      const originNet = wsNetUrlForOrigin(window.location.origin);
      if (originNet) return originNet;
    }
    // On localhost, prefer the native apptron worker at ws://127.0.0.1:8080
    // when it's running. It provides full native networking (TLS, large
    // downloads, etc.) which the remote-relay fallback can stall on.
    const host = window.location.hostname;
    const isLocal = host === "127.0.0.1" || host === "localhost" || host === "::1";
    if (isLocal) {
      const local = qp.get("worker_url") || "ws://127.0.0.1:8080/x/net";
      if (await probeWebSocket(local, 600)) return local;
    }
    return configuredRelayUrl();
  }

  function sleepMs(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function createXtermWithRetry(runtime, attempts = 6) {
    for (let i = 0; i < attempts; i++) {
      try {
        const terminalId = (await runtime.readText("web/dom/new/xterm")).trim();
        if (terminalId) {
          return terminalId;
        }
      } catch {
        // Retry: early runtime boot can briefly reject xterm creation.
      }
      await sleepMs(200 * (i + 1));
    }
    return "";
  }

  // Intentionally no in-shell bootstrap: no DHCP, no route, no DNS, no relay
  // rc sourcing. The shell boots clean. Users opt-in to networking manually
  // (e.g. `ifconfig eth0 up && udhcpc -i eth0`) or via Settings later.

  const ideBridgeMode = qp.get("ide_bridge") === "1";
  const networkUrl = await resolveNetwork();
  status.textContent = `Booting Apptron runtime...`;

  const runtime = new WanixRuntime({
    // Keep screen pipeline enabled in bridge mode. Disabling it can leave
    // xterm/console channels attachable but without a live producer.
    screen: ideBridgeMode,
    helpers: true,
    debug9p: qp.get("debug9p") === "true",
    wasm: qp.get("wasm") || "./wanix.wasm",
    bundle: qp.get("bundle") || "./bundles/sys.tar.gz",
    network: networkUrl
  });

  // Enable on-demand bundle loading (Go toolchain etc.) via relay proxy
  runtime._getBundle = async (name) => {
    const url = `https://relay.traits.build/${name}`;
    console.log('[bundle] fetching', name);
    const cache = await caches.open('apptron-bundles');
    const cached = await cache.match(url);
    if (cached) {
      console.log('[bundle] cache hit', name);
      return await cached.arrayBuffer();
    }
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Bundle fetch failed: ${resp.status} ${name}`);
    await cache.put(url, resp.clone());
    console.log('[bundle] cached', name);
    return await resp.arrayBuffer();
  };

  window.apptron.instance = runtime;

  try {
    await runtime.ready();
    // Stock Apptron persistence (idbfs "apptron-rev1") is already wired by
    // boot.go for /home/<username>, /project, and /public at this point.
    const terminalId = await createXtermWithRetry(runtime);
    window.apptron.terminalId = terminalId;
    if (terminalId) {
      await runtime.writeFile("task/1/ctl", `bind #console/data web/dom/${terminalId}/data`);
      await runtime.writeFile("web/dom/body/ctl", `append-child ${terminalId}`);
      try {
        await runtime.writeFile(`web/dom/${terminalId}/data`, "\n");
      } catch {
        // Non-fatal.
      }
      try {
        await runtime.writeFile("vm/1/fsys/tmp/.apptron-terminal-id", `${terminalId}\n`);
      } catch {
        // Best effort only.
      }
      try {
        localStorage.setItem("apptron-terminal-id", terminalId);
      } catch {
        // localStorage may be unavailable.
      }
    }
    if (ideBridgeMode) {
      status.textContent = `Apptron runtime ready for IDE bridge`;
    } else {
      status.textContent = `Apptron shell ready`;
    }
    status.classList.add("ready");
  } catch (error) {
    console.error("Apptron console bootstrap failed", error);
    status.textContent = `Apptron boot failed: ${error?.message || error}`;
  }
</script>
</body>
</html>
